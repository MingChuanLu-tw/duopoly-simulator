<script>
"use strict";

/* =====================================================================
 * Econ — 計算核心 Calculation core（純函數 pure functions，不碰 DOM）
 *
 * 需求 Inverse demand:  P1 = a − b·q1 − γ·q2,  P2 = a − b·q2 − γ·q1,  γ = θ·b
 * θ = 1 為同質產品 Homogeneous；0 ≤ θ < 1 為差異化 Differentiated。
 *
 * 每個模型函數輸入 {a, b, c1, c2, theta, leader}，回傳
 * {p1, p2, q1, q2, pi1, pi2, cs, sw, dwl, lerner:{l1,l2}, hhi, corner}
 * corner 為 null 或 {type, firm, computed, msgZh, msgEn}。
 * 同質模型中 p1 = p2 = 市場價格 Market price。
 * ===================================================================== */
const Econ = (() => {
  const HOMO_EPS = 1e-6;   // θ ≥ 1 − HOMO_EPS 視為同質
  const NOISE = 1e-9;      // 浮點雜訊門檻

  const fin = x => (Number.isFinite(x) ? x : 0);
  const pos = x => (Number.isFinite(x) && x > 0 ? x : 0);
  const nz = x => (Math.abs(x) < NOISE ? 0 : x);   // 去除 −0 與浮點雜訊

  /* ---------- 參數正規化 Parameter normalization ---------- */
  function normalize(input = {}) {
    const a = Math.max(pos(Number(input.a)), 1e-9);
    const b = Math.max(pos(Number(input.b)), 1e-9);
    const c1 = Math.min(pos(Number(input.c1)), a);
    const c2 = Math.min(pos(Number(input.c2)), a);
    const rawTheta = input.theta === undefined ? 1 : Number(input.theta);
    const theta = Math.min(Math.max(fin(rawTheta), 0), 1);
    const homo = theta >= 1 - HOMO_EPS;
    const g = homo ? b : theta * b;
    const leader = Number(input.leader) === 2 ? 2 : 1;
    return { a, b, c1, c2, theta: homo ? 1 : theta, g, homo, leader };
  }

  const costOf = (par, i) => (i === 1 ? par.c1 : par.c2);

  /* ---------- 角解訊息 Corner messages ---------- */
  const corners = {
    exit: firm => ({
      type: "exit", firm, computed: true,
      msgZh: `廠商 ${firm} 成本過高，產量為 0（退出市場）`,
      msgEn: `Firm ${firm} exits: its cost is too high to produce.`
    }),
    undercut: firm => ({
      type: "undercut", firm, computed: true,
      msgZh: `廠商 ${firm} 以略低於對手成本的價格（ε → 0）拿下整個市場`,
      msgEn: `Firm ${firm} undercuts at the rival's cost (ε → 0) and takes the whole market.`
    }),
    monopolyPrice: firm => ({
      type: "monopoly-price", firm, computed: true,
      msgZh: `對手成本高於廠商 ${firm} 的獨占價，廠商 ${firm} 直接訂獨占價`,
      msgEn: `Rival's cost exceeds Firm ${firm}'s monopoly price, so Firm ${firm} charges it.`
    }),
    limitPricing: firm => ({
      type: "limit-pricing", firm, computed: false,
      msgZh: "此參數組合屬於限制性定價 Limit pricing 區間，本模擬器不計算，請調整 c 或 θ",
      msgEn: "These parameters fall in the limit-pricing region, which is not computed. Adjust c or θ."
    }),
    followerExit: (leader, follower) => ({
      type: "follower-exit", firm: follower, computed: true,
      msgZh: `領導者（廠商 ${leader}）產量足以讓追隨者（廠商 ${follower}）退出：嚇阻進入 Entry deterrence`,
      msgEn: `Leader (Firm ${leader}) produces enough to keep the follower (Firm ${follower}) out: entry deterrence.`
    }),
    leaderExit: (leader, follower) => ({
      type: "leader-exit", firm: leader, computed: true,
      msgZh: `領導者（廠商 ${leader}）成本過高，產量為 0，由追隨者（廠商 ${follower}）獨占`,
      msgEn: `Leader (Firm ${leader}) is too costly to produce; the follower (Firm ${follower}) is a monopolist.`
    }),
    noOutput: () => ({
      type: "no-output", firm: null, computed: true,
      msgZh: "兩家成本都不低於需求截距 a，市場沒有交易",
      msgEn: "Both costs are at or above the demand intercept a; nothing is traded."
    })
  };

  /* ---------- 福利與指標 Welfare & metrics ---------- */
  function consumerSurplus(par, q1, q2) {
    const { b, g } = par;
    return 0.5 * (b * q1 * q1 + 2 * g * q1 * q2 + b * q2 * q2);
  }

  function pack(par, q1, q2, p1, p2, corner, swPC) {
    q1 = nz(pos(q1)); q2 = nz(pos(q2));
    p1 = nz(pos(p1)); p2 = nz(pos(p2));
    const pi1 = q1 > 0 ? nz((p1 - par.c1) * q1) : 0;
    const pi2 = q2 > 0 ? nz((p2 - par.c2) * q2) : 0;
    const cs = nz(consumerSurplus(par, q1, q2));
    const sw = nz(cs + pi1 + pi2);
    const dwl = swPC === undefined ? 0 : nz(swPC - sw);
    const l1 = q1 > 0 && p1 > 0 ? nz((p1 - par.c1) / p1) : 0;
    const l2 = q2 > 0 && p2 > 0 ? nz((p2 - par.c2) / p2) : 0;
    const Q = q1 + q2;
    const hhi = Q > 0 ? nz(10000 * ((q1 / Q) ** 2 + (q2 / Q) ** 2)) : 0;
    return { p1, p2, q1, q2, pi1, pi2, cs, sw, dwl, lerner: { l1, l2 }, hhi, corner: corner || null };
  }

  const inverseP = (par, qi, qj) => par.a - par.b * qi - par.g * qj;
  const directQ = (par, pi, pj) => {
    const { a, b, g } = par;
    return (a * (b - g) - b * pi + g * pj) / (b * b - g * g);
  };

  /* ---------- 完全競爭 Perfect competition（P = MC） ---------- */
  function pcRaw(par) {
    const { a, b, c1, c2 } = par;
    if (par.homo) {
      const cL = Math.min(c1, c2);
      const Q = pos((a - cL) / b);
      if (Q === 0) return { q1: 0, q2: 0, p1: cL, p2: cL, corner: corners.noOutput() };
      if (Math.abs(c1 - c2) < NOISE) return { q1: Q / 2, q2: Q / 2, p1: cL, p2: cL, corner: null };
      const low = c1 < c2 ? 1 : 2;
      return low === 1
        ? { q1: Q, q2: 0, p1: cL, p2: cL, corner: corners.exit(2) }
        : { q1: 0, q2: Q, p1: cL, p2: cL, corner: corners.exit(1) };
    }
    let q1 = directQ(par, c1, c2), q2 = directQ(par, c2, c1);
    let corner = null;
    if (q1 <= 0 && q2 <= 0) return { q1: 0, q2: 0, p1: c1, p2: c2, corner: corners.noOutput() };
    if (q2 <= 0) { q2 = 0; q1 = pos((a - c1) / b); corner = corners.exit(2); }
    else if (q1 <= 0) { q1 = 0; q2 = pos((a - c2) / b); corner = corners.exit(1); }
    return { q1, q2, p1: c1, p2: c2, corner };
  }

  function swPerfectCompetition(par) {
    const r = pcRaw(par);
    return pack(par, r.q1, r.q2, r.p1, r.p2, r.corner).sw;
  }

  function perfectCompetition(input) {
    const par = normalize(input);
    const r = pcRaw(par);
    const out = pack(par, r.q1, r.q2, r.p1, r.p2, r.corner);
    out.dwl = 0;
    return out;
  }

  /* ---------- 獨占 Monopoly（聯合利潤最大 Joint profit max） ---------- */
  function monopoly(input) {
    const par = normalize(input);
    const { a, b, g, c1, c2 } = par;
    const swPC = swPerfectCompetition(par);
    if (par.homo) {
      const cL = Math.min(c1, c2);
      const Q = pos((a - cL) / (2 * b));
      const P = (a + cL) / 2;
      if (Q === 0) return pack(par, 0, 0, P, P, corners.noOutput(), swPC);
      if (Math.abs(c1 - c2) < NOISE) return pack(par, Q / 2, Q / 2, P, P, null, swPC);
      return c1 < c2
        ? pack(par, Q, 0, P, P, corners.exit(2), swPC)
        : pack(par, 0, Q, P, P, corners.exit(1), swPC);
    }
    const D = b * b - g * g;
    let q1 = (b * (a - c1) - g * (a - c2)) / (2 * D);
    let q2 = (b * (a - c2) - g * (a - c1)) / (2 * D);
    let corner = null;
    if (q1 <= 0 && q2 <= 0) { q1 = 0; q2 = 0; corner = corners.noOutput(); }
    else if (q2 <= 0) { q2 = 0; q1 = pos((a - c1) / (2 * b)); corner = corners.exit(2); }
    else if (q1 <= 0) { q1 = 0; q2 = pos((a - c2) / (2 * b)); corner = corners.exit(1); }
    return pack(par, q1, q2, inverseP(par, q1, q2), inverseP(par, q2, q1), corner, swPC);
  }

  /* ---------- Cournot 數量競爭 ---------- */
  function cournot(input) {
    const par = normalize(input);
    const { a, b, g, c1, c2 } = par;
    const swPC = swPerfectCompetition(par);
    const den = 4 * b * b - g * g;
    let q1 = (2 * b * (a - c1) - g * (a - c2)) / den;
    let q2 = (2 * b * (a - c2) - g * (a - c1)) / den;
    let corner = null;
    if (q1 <= 0 && q2 <= 0) { q1 = 0; q2 = 0; corner = corners.noOutput(); }
    else if (q2 <= 0) { q2 = 0; q1 = pos((a - c1) / (2 * b)); corner = corners.exit(2); }
    else if (q1 <= 0) { q1 = 0; q2 = pos((a - c2) / (2 * b)); corner = corners.exit(1); }
    return pack(par, q1, q2, inverseP(par, q1, q2), inverseP(par, q2, q1), corner, swPC);
  }

  /* ---------- Bertrand 價格競爭 ---------- */
  function bertrandHomo(par) {
    const { a, b, c1, c2 } = par;
    const swPC = swPerfectCompetition(par);
    if (Math.abs(c1 - c2) < NOISE) {
      const P = c1;
      const Q = pos((a - P) / b);
      return pack(par, Q / 2, Q / 2, P, P, Q === 0 ? corners.noOutput() : null, swPC);
    }
    const low = c1 < c2 ? 1 : 2;
    const cL = Math.min(c1, c2), cH = Math.max(c1, c2);
    const pm = (a + cL) / 2;
    let P, corner;
    if (cH < pm) { P = cH; corner = corners.undercut(low); }
    else { P = pm; corner = corners.monopolyPrice(low); }
    const Q = pos((a - P) / b);
    return low === 1 ? pack(par, Q, 0, P, P, corner, swPC) : pack(par, 0, Q, P, P, corner, swPC);
  }

  function bertrandDiff(par) {
    const { a, b, g, c1, c2 } = par;
    const swPC = swPerfectCompetition(par);
    const den = 4 * b * b - g * g;
    const k1 = a * (b - g) + b * c1, k2 = a * (b - g) + b * c2;
    const p1 = (2 * b * k1 + g * k2) / den;
    const p2 = (2 * b * k2 + g * k1) / den;
    const q1 = directQ(par, p1, p2), q2 = directQ(par, p2, p1);
    if (q1 > 0 && q2 > 0) return pack(par, q1, q2, p1, p2, null, swPC);
    if (q1 <= 0 && q2 <= 0) return pack(par, 0, 0, c1, c2, corners.noOutput(), swPC);

    // 有一家內部解產量 ≤ 0：檢查另一家獨占是否成立
    const i = q1 > 0 ? 1 : 2, j = 3 - i;
    const ci = costOf(par, i), cj = costOf(par, j);
    const qm = pos((a - ci) / (2 * b));
    const pm = (a + ci) / 2;
    const choke = a - g * qm;               // 廠商 j 的需求截距（給定 q_i = qm）
    if (choke <= cj) {
      return i === 1
        ? pack(par, qm, 0, pm, choke, corners.exit(2), swPC)
        : pack(par, 0, qm, choke, pm, corners.exit(1), swPC);
    }
    // Limit pricing 區間：依規格 v1 不計算，回傳全 0 並標示 computed = false
    const out = pack(par, 0, 0, 0, 0, corners.limitPricing(j));
    return out;
  }

  function bertrand(input) {
    const par = normalize(input);
    return par.homo ? bertrandHomo(par) : bertrandDiff(par);
  }

  /* ---------- Stackelberg 數量領導 ---------- */
  function stackelbergSetup(par) {
    const { a, b, g } = par;
    const L = par.leader, F = 3 - L;
    const cL = costOf(par, L), cF = costOf(par, F);
    const RF = qL => Math.max(0, (a - cF - g * qL) / (2 * b));
    const profitL = qL => (a - b * qL - g * RF(qL) - cL) * qL;
    const qMax = pos((a - cL) / b);
    return { L, F, cL, cF, RF, profitL, qMax };
  }

  // 數值解：2,000 格點＋黃金分割細化 Grid + golden-section refinement
  function stackelbergNumeric(input) {
    const par = normalize(input);
    const { profitL, qMax } = stackelbergSetup(par);
    if (qMax === 0) return 0;
    const N = 2000;
    let best = 0, bestV = profitL(0);
    for (let k = 1; k <= N; k++) {
      const x = (qMax * k) / N, v = profitL(x);
      if (v > bestV) { bestV = v; best = x; }
    }
    let lo = Math.max(0, best - qMax / N), hi = Math.min(qMax, best + qMax / N);
    const r = (Math.sqrt(5) - 1) / 2;
    let x1 = hi - r * (hi - lo), x2 = lo + r * (hi - lo);
    let f1 = profitL(x1), f2 = profitL(x2);
    for (let it = 0; it < 80; it++) {
      if (f1 < f2) { lo = x1; x1 = x2; f1 = f2; x2 = lo + r * (hi - lo); f2 = profitL(x2); }
      else { hi = x2; x2 = x1; f2 = f1; x1 = hi - r * (hi - lo); f1 = profitL(x1); }
    }
    const xm = (lo + hi) / 2;
    return profitL(xm) >= bestV ? xm : best;
  }

  // 封閉解（含兩種角解）Closed form, piecewise
  function stackelbergAnalytic(par) {
    const { a, b, g } = par;
    const { cL, cF, qMax } = stackelbergSetup(par);
    const qA = (2 * b * (a - cL) - g * (a - cF)) / (2 * (2 * b * b - g * g));
    const kink = g > 0 ? (a - cF) / g : Infinity;     // q_L 超過此值時追隨者產量為 0
    let q;
    if (kink <= 0) q = pos((a - cL) / (2 * b));
    else if (qA <= 0) q = 0;
    else if (qA < kink) q = qA;
    else q = Math.max(kink, (a - cL) / (2 * b));
    return Math.min(pos(q), qMax);
  }

  function stackelberg(input) {
    const par = normalize(input);
    const swPC = swPerfectCompetition(par);
    const { L, F, RF, profitL } = stackelbergSetup(par);
    let qL = stackelbergAnalytic(par);
    const qNum = stackelbergNumeric(par);
    if (Math.abs(qNum - qL) > 0.01 && profitL(qNum) > profitL(qL)) qL = qNum;  // 規格：差距 > 0.01 採數值解
    const qF = RF(qL);
    let corner = null;
    if (qL <= NOISE && qF <= NOISE) corner = corners.noOutput();
    else if (qL <= NOISE) corner = corners.leaderExit(L, F);
    else if (qF <= NOISE) corner = corners.followerExit(L, F);
    const pL = inverseP(par, qL, qF), pF = inverseP(par, qF, qL);
    return L === 1
      ? pack(par, qL, qF, pL, pF, corner, swPC)
      : pack(par, qF, qL, pF, pL, corner, swPC);
  }

  /* ---------- 反應函數 Best responses ---------- */
  const reaction = {
    // Cournot / Stackelberg 追隨者：數量空間
    quantity(input, i, qj) {
      const par = normalize(input);
      return pos((par.a - costOf(par, i) - par.g * qj) / (2 * par.b));
    },
    // 差異化 Bertrand：價格空間
    priceDiff(input, i, pj) {
      const par = normalize(input);
      const { a, b, g } = par;
      const ci = costOf(par, i);
      return Math.max(ci, (a * (b - g) + b * ci + g * pj) / (2 * b));
    },
    // 同質 Bertrand：分段折線（削價 step 預設 0.01 = ε）
    priceHomo(input, i, pj, step = 0.01) {
      const par = normalize(input);
      const ci = costOf(par, i);
      const pm = (par.a + ci) / 2;
      if (pj > pm) return pm;
      if (pj > ci) return Math.max(ci, pj - step);
      return ci;
    }
  };

  /* ---------- 動態調整 Best-response dynamics ---------- */
  // x_i^{t+1} = x_i^t + λ (BR_i(x_j^t) − x_i^t)
  function dynamics(model, input, opts = {}) {
    const par = normalize(input);
    const lambda = Math.min(Math.max(fin(opts.lambda ?? 1), 0.01), 1);
    const mode = opts.mode === "sequential" ? "sequential" : "simultaneous";
    const maxSteps = Math.max(1, Math.floor(fin(opts.maxSteps ?? 50)));
    const tol = pos(opts.tol ?? 0.01) || 0.01;
    let br;
    if (model === "cournot") br = (i, xj) => reaction.quantity(par, i, xj);
    else if (model === "bertrand" && !par.homo) br = (i, xj) => reaction.priceDiff(par, i, xj);
    else if (model === "bertrand") br = (i, xj) => reaction.priceHomo(par, i, xj, 1); // 同質：每步削價 1 單位
    else return { path: [], converged: false, steps: 0, applicable: false };

    const start = Array.isArray(opts.start) ? opts.start : [0, 0];
    let x1 = pos(Number(start[0])), x2 = pos(Number(start[1]));
    const residual = () => Math.max(Math.abs(br(1, x2) - x1), Math.abs(br(2, x1) - x2));
    const path = [{ t: 0, x1, x2 }];
    let converged = residual() < tol, steps = 0;
    for (let t = 1; t <= maxSteps && !converged; t++) {
      let n1 = x1, n2 = x2;
      if (mode === "simultaneous" || t % 2 === 1) n1 = x1 + lambda * (br(1, x2) - x1);
      if (mode === "simultaneous" || t % 2 === 0) n2 = x2 + lambda * (br(2, x1) - x2);
      x1 = nz(pos(n1)); x2 = nz(pos(n2));
      path.push({ t, x1, x2 });
      steps = t;
      converged = residual() < tol;
    }
    return { path, converged, steps, applicable: true };
  }

  const solve = (model, input) => ({
    cournot, bertrand, stackelberg,
    perfectCompetition, monopoly
  }[model] || cournot)(input);

  return {
    normalize, cournot, bertrand, stackelberg, perfectCompetition, monopoly,
    solve, reaction, dynamics,
    _stackelbergNumeric: stackelbergNumeric,
    _stackelbergAnalytic: input => stackelbergAnalytic(normalize(input))
  };
})();

        try { res = Econ.solve(m, { ...ps, theta, leader }); }
        catch (e) { problems.push(`${m} θ=${theta}: ${e.message}`); continue; }
        for (const [k, v] of numericFields(res)) {
          if (!Number.isFinite(v)) problems.push(`${m} θ=${theta} L=${leader}: ${k} = ${v}`);
          else if (v < 0) problems.push(`${m} θ=${theta} L=${leader}: ${k} = ${v.toFixed(4)} < 0`);
        }
      }
      rows.push({
        label: `a=${ps.a}, b=${ps.b}, c=${ps.c1} / ${ps.c2}`,
        detail: problems.length ? problems.slice(0, 4).join("；") : `${runs} 次計算全部有限且非負`,
        pass: problems.length === 0
      });
    }
    return rows;
  }

  /* ---- 額外 2：Stackelberg 封閉解 vs 數值解 ---- */
  function runStackelbergAgreement() {
    let maxDiff = 0, count = 0, worst = "";
    for (const theta of [0, 0.3, 0.5, 0.8, 0.95, 1])
      for (const c1 of [0, 10, 40, 70, 95])
        for (const c2 of [0, 10, 40, 70, 95])
          for (const leader of [1, 2]) {
            const inp = { a: 100, b: 1, c1, c2, theta, leader };
            const d = Math.abs(Econ._stackelbergAnalytic(inp) - Econ._stackelbergNumeric(inp));
            count++;
            if (d > maxDiff) { maxDiff = d; worst = `θ=${theta}, c=${c1}/${c2}, L=${leader}`; }
          }
    return [{
      label: `${count} 組參數（含角解）`,
      detail: `最大差距 q_L = ${maxDiff.toExponential(2)}${worst ? `（${worst}）` : ""}`,
      pass: maxDiff <= TOL
    }];
  }

  /* ---- 額外 3：理論排序（案例 A） ---- */
  function runOrdering() {
    const p = P(10, 10);
    const sw = {
      pc: Econ.perfectCompetition(p).sw, b: Econ.bertrand(p).sw, s: Econ.stackelberg(p).sw,
      c: Econ.cournot(p).sw, m: Econ.monopoly(p).sw
    };
    const okSW = Math.abs(sw.pc - sw.b) <= TOL && sw.b > sw.s && sw.s > sw.c && sw.c > sw.m;
    const d = P(10, 10, 0.5);
    const okDiff = Econ.bertrand(d).p1 < Econ.cournot(d).p1 && Econ.bertrand(d).sw > Econ.cournot(d).sw;
    const sA = Econ.stackelberg(p), cA = Econ.cournot(p);
    const okFirstMover = sA.pi1 > cA.pi1 && sA.pi2 < cA.pi2;
    return [
      { label: "案例 A 社會福利：PC = Bertrand > Stackelberg > Cournot > 獨占",
        detail: `${sw.pc} = ${sw.b} > ${sw.s} > ${sw.c} > ${sw.m}`, pass: okSW },
      { label: "案例 D：Bertrand 價格低於 Cournot、福利較高", detail: "Singh & Vives (1984)", pass: okDiff },
      { label: "先行者優勢：π_L > π_Cournot > π_F", detail: `${sA.pi1} > ${cA.pi1} > ${sA.pi2}`, pass: okFirstMover }
    ];
  }

  function run() {
    const spec = specCases.map(runSpecCase);
    spec.push(runDynamicsCase());
    const sweep = runSweep();
    const agree = runStackelbergAgreement();
    const order = runOrdering();
    const all = [...spec, ...sweep, ...agree, ...order];
    return {
      spec, sweep, agree, order,
      specPassed: spec.filter(r => r.pass).length, specTotal: spec.length,
      passed: all.filter(r => r.pass).length, total: all.length
    };
  }

  return { run, TOL };
})();

/* =====================================================================
 * Subst — F12 公式代入目前數值（純函數，不碰 DOM）
 * 每一項回傳 {text, tex, value, actual, note}：
 *   text  純文字算式，例如 q₁* = (100 − 2·10 + 10)/(3·1) = 30.00
 *   tex   同一算式的 KaTeX 版本
 *   value 公式（內部解）算出的值；actual 為 Econ 實際採用的值（角解時兩者不同）
 * ===================================================================== */
const Subst = (() => {
  const num = v => { const r = Math.round(v * 1000) / 1000; return String(r === 0 ? 0 : r); };
  const f2 = v => (Math.abs(v) < 0.005 ? 0 : v)
    .toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 }).replace("-", "−");
  const SUB = { "₁": "_{1}", "₂": "_{2}" };
  // 純文字 → TeX（只處理本模組會用到的符號）
  const tx = s => String(s)
    .replace(/,/g, "{,}")
    .replace(/[₁₂]/g, ch => SUB[ch])
    .replace(/\*/g, "^{*}")
    .replace(/ᵐ/g, "^{m}")
    .replace(/²/g, "^{2}")
    .replace(/−/g, "-")
    .replace(/·/g, "\\cdot ")
    .replace(/γ/g, "\\gamma ")
    .replace(/π/g, "\\pi ")
    .replace(/ε/g, "\\varepsilon ")
    .replace(/≥/g, "\\ge ")
    .replace(/⇒/g, "\\;\\Rightarrow\\; ");
  const wrap = s => (/[ ·+−]/.test(s) ? `(${s})` : s);      // 單一數字不加括號
  const frac = (n, d) => ({ text: `${wrap(n)}/${wrap(d)}`, tex: `\\dfrac{${tx(n)}}{${tx(d)}}` });
  const sub = i => (i === 1 ? "₁" : "₂");

  // lhs = 分式 = 結果
  function line(lhs, fr, value, actual) {
    const item = {
      text: `${lhs} = ${fr.text} = ${f2(value)}`,
      tex: `${tx(lhs)} = ${fr.tex} = ${tx(f2(value))}`,
      value, actual: actual === undefined ? value : actual, note: null
    };
    if (Math.abs(item.value - item.actual) > 1e-6) {
      item.note = `內部解為 ${f2(value)}，不可行 → 角解 Corner：實際採用 ${f2(item.actual)}`;
    }
    return item;
  }
  // lhs = 表達式 = 結果（無分式）
  function plain(lhs, expr, value, actual) {
    const item = {
      text: `${lhs} = ${expr} = ${f2(value)}`,
      tex: `${tx(lhs)} = ${tx(expr)} = ${tx(f2(value))}`,
      value, actual: actual === undefined ? value : actual, note: null
    };
    if (Math.abs(item.value - item.actual) > 1e-6) {
      item.note = `內部解為 ${f2(value)}，不可行 → 角解 Corner：實際採用 ${f2(item.actual)}`;
    }
    return item;
  }

  function cournot(par, r) {
    const { a, b, g, c1, c2, homo } = par;
    const A = num(a), B = num(b), G = num(g), C = [null, num(c1), num(c2)];
    const out = [];
    for (const i of [1, 2]) {
      const j = 3 - i, ci = i === 1 ? c1 : c2, cj = i === 1 ? c2 : c1;
      const actual = r[`q${i}`];
      if (homo) {
        out.push(line(`q${sub(i)}*`, frac(`${A} − 2·${C[i]} + ${C[j]}`, `3·${B}`), (a - 2 * ci + cj) / (3 * b), actual));
      } else {
        out.push(line(`q${sub(i)}*`, frac(`2·${B}·(${A} − ${C[i]}) − ${G}·(${A} − ${C[j]})`, `4·${B}² − ${G}²`),
          (2 * b * (a - ci) - g * (a - cj)) / (4 * b * b - g * g), actual));
      }
    }
    if (homo) out.push(line("P*", frac(`${A} + ${C[1]} + ${C[2]}`, "3"), (a + c1 + c2) / 3, r.p1));
    return out;
  }

  function bertrand(par, r) {
    const { a, b, g, c1, c2, homo } = par;
    const A = num(a), B = num(b), G = num(g);
    if (homo) {
      if (Math.abs(c1 - c2) < 1e-9) {
        return [plain("P*", `c₁ = c₂`, c1, r.p1)].map(it => ({ ...it,
          text: `P* = c₁ = c₂ = ${f2(c1)}`, tex: `P^{*} = c_{1} = c_{2} = ${tx(f2(c1))}` }));
      }
      const L = c1 < c2 ? 1 : 2, H = 3 - L;
      const cL = Math.min(c1, c2), cH = Math.max(c1, c2);
      const pm = (a + cL) / 2;
      const items = [line(`p${sub(L)}ᵐ`, frac(`${A} + ${num(cL)}`, "2"), pm)];
      if (cH < pm) {
        const it = plain("P*", `c${sub(H)} − ε`, cH, r.p1);
        items.push({ ...it, text: `P* = c${sub(H)} − ε → ${f2(cH)}`, tex: `P^{*} = c_{${H}} - \\varepsilon \\to ${tx(f2(cH))}` });
        items.push(plain(`π${sub(L)}*`, `(${num(cH)} − ${num(cL)})·(${A} − ${num(cH)})/${B}`, (cH - cL) * (a - cH) / b, r[`pi${L}`]));
      } else {
        const it = plain("P*", `p${sub(L)}ᵐ`, pm, r.p1);
        items.push({ ...it, text: `c${sub(H)} = ${num(cH)} ≥ p${sub(L)}ᵐ ⇒ P* = p${sub(L)}ᵐ = ${f2(pm)}`,
          tex: tx(`c${sub(H)} = ${num(cH)} ≥ p${sub(L)}ᵐ ⇒ P* = p${sub(L)}ᵐ = ${f2(pm)}`) });
      }
      return items;
    }
    const k = [null, a * (b - g) + b * c1, a * (b - g) + b * c2];
    const C = [null, num(c1), num(c2)];
    const limit = !!(r.corner && r.corner.computed === false);
    const out = [];
    for (const i of [1, 2]) {
      out.push(plain(`k${sub(i)}`, `${A}·(${B} − ${G}) + ${B}·${C[i]}`, k[i]));
    }
    for (const i of [1, 2]) {
      const j = 3 - i;
      const value = (2 * b * k[i] + g * k[j]) / (4 * b * b - g * g);
      const it = line(`p${sub(i)}*`, frac(`2·${B}·${num(k[i])} + ${G}·${num(k[j])}`, `4·${B}² − ${G}²`), value, limit ? value : r[`p${i}`]);
      if (limit) it.note = "此參數組合屬於 limit pricing 區間，實際均衡未計算";
      out.push(it);
    }
    return out;
  }

  function stackelberg(par, r) {
    const { a, b, g, homo, leader: L } = par;
    const F = 3 - L;
    const cL = L === 1 ? par.c1 : par.c2, cF = L === 1 ? par.c2 : par.c1;
    const A = num(a), B = num(b), G = num(g), CL = num(cL), CF = num(cF);
    const qA = homo ? (a - 2 * cL + cF) / (2 * b) : (2 * b * (a - cL) - g * (a - cF)) / (2 * (2 * b * b - g * g));
    const out = [];
    out.push(homo
      ? line(`q${sub(L)}*`, frac(`${A} − 2·${CL} + ${CF}`, `2·${B}`), qA, r[`q${L}`])
      : line(`q${sub(L)}*`, frac(`2·${B}·(${A} − ${CL}) − ${G}·(${A} − ${CF})`, `2·(2·${B}² − ${G}²)`), qA, r[`q${L}`]));
    if (homo) {
      out.push(line(`q${sub(F)}*`, frac(`${A} + 2·${CL} − 3·${CF}`, `4·${B}`), (a + 2 * cL - 3 * cF) / (4 * b), r[`q${F}`]));
    } else {
      const qLa = r[`q${L}`];   // 追隨者對領導者實際產量的反應
      out.push(line(`q${sub(F)}*`, frac(`${A} − ${CF} − ${G}·${num(qLa)}`, `2·${B}`), (a - cF - g * qLa) / (2 * b), r[`q${F}`]));
    }
    return out;
  }

  function get(model, input) {
    const par = Econ.normalize(input);
    const r = Econ.solve(model, input);
    if (model === "cournot") return cournot(par, r);
    if (model === "bertrand") return bertrand(par, r);
    if (model === "stackelberg") return stackelberg(par, r);
    return [];
  }

  return { get, tx };
})();

/* =====================================================================
 * Iso — F16 等利潤曲線 Isoprofit curves（純函數）
 * 數量空間：π_i = (a − b·q_i − γ·q_j − c_i)·q_i = π̄  ⇒  q_j = (a − c_i − b·q_i − π̄/q_i)/γ
 * 價格空間（差異化 Bertrand）：π_i = (p_i − c_i)·q_i(p_i, p_j) = π̄  ⇒  解出 p_j
 * ===================================================================== */
const Iso = (() => {
  const costOf = (par, i) => (i === 1 ? par.c1 : par.c2);
  function quantity(input, firm, piBar, qi) {
    const par = Econ.normalize(input);
    if (par.g <= 1e-12 || !(qi > 0)) return NaN;
    return (par.a - costOf(par, firm) - par.b * qi - piBar / qi) / par.g;
  }
  function quantityProfit(input, firm, qi, qj) {
    const par = Econ.normalize(input);
    return (par.a - par.b * qi - par.g * qj - costOf(par, firm)) * qi;
  }
  // 等利潤曲線斜率 d q_j / d q_i
  function quantitySlope(input, firm, piBar, qi) {
    const par = Econ.normalize(input);
    if (par.g <= 1e-12 || !(qi > 0)) return NaN;
    return (-par.b + piBar / (qi * qi)) / par.g;
  }
  function price(input, firm, piBar, pi) {
    const par = Econ.normalize(input);
    const ci = costOf(par, firm);
    if (par.homo || par.g <= 1e-12 || !(pi > ci)) return NaN;
    const D = par.b * par.b - par.g * par.g;
    const A0 = (par.a * (par.b - par.g)) / D, B0 = par.b / D, C0 = par.g / D;
    return (piBar / (pi - ci) - A0 + B0 * pi) / C0;
  }
  function priceProfit(input, firm, pi, pj) {
    const par = Econ.normalize(input);
    const D = par.b * par.b - par.g * par.g;
    const q = (par.a * (par.b - par.g) - par.b * pi + par.g * pj) / D;
    return (pi - costOf(par, firm)) * q;
  }
  return { quantity, quantityProfit, quantitySlope, price, priceProfit };
})();

/* =====================================================================
 * Market — F15 市場圖資料（純函數；回傳通用繪圖規格，Plotly 與 SVG 備援共用）
 * 同質：市場需求 P = a − bQ、MC 線、五種市場結構的 (Q, P)、目前模型的 CS 陰影
 * 差異化：沒有單一市場需求，改畫廠商 1 在對手均衡策略下的剩餘需求 Residual demand
 * ===================================================================== */
const Market = (() => {
  const f2 = v => (Math.abs(v) < 0.005 ? 0 : v).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const STRUCTS = [
    { key: "cournot", name: "Cournot", symbol: "circle" },
    { key: "bertrand", name: "Bertrand", symbol: "square" },
    { key: "stackelberg", name: "Stackelberg", symbol: "triangle-up" },
    { key: "pc", name: "完全競爭 PC", symbol: "cross" },
    { key: "monopoly", name: "獨占 Monopoly", symbol: "x" }
  ];
  const isLimit = r => !!(r && r.corner && r.corner.computed === false);

  // 同質需求線上的點：P = a − bQ
  function build(input, res, model) {
    const par = Econ.normalize(input);
    const { a, b, g, c1, c2 } = par;
    const spec = { xs: "Q", ys: "P", lines: [], polys: [], points: [], note: "" };
    if (par.homo) {
      const Qmax = a / b;
      spec.xTitle = "總產量 Q Quantity"; spec.yTitle = "價格 P Price";
      spec.xRange = [0, Qmax * 1.02]; spec.yRange = [0, a * 1.02];
      const r = res[model];
      if (!isLimit(r)) {
        const Q = r.q1 + r.q2, P = r.p1;
        spec.polys.push({ name: `消費者剩餘 CS = ${f2(r.cs)}`, color: "--cs", x: [0, 0, Q, 0], y: [P, a, P, P] });
      }
      spec.lines.push({ name: "需求 Demand P = a − bQ", color: "--fg", width: 2.5, x: [0, Qmax], y: [a, 0] });
      if (Math.abs(c1 - c2) < 1e-9) {
        spec.lines.push({ name: `MC = c = ${f2(c1)}`, color: "--sw", dash: "dash", width: 2, x: [0, Qmax], y: [c1, c1] });
      } else {
        spec.lines.push({ name: `MC₁ = c₁ = ${f2(c1)}`, color: "--f1", dash: "dash", width: 2, x: [0, Qmax], y: [c1, c1] });
        spec.lines.push({ name: `MC₂ = c₂ = ${f2(c2)}`, color: "--f2", dash: "dash", width: 2, x: [0, Qmax], y: [c2, c2] });
      }
      for (const s of STRUCTS) {
        const rs = res[s.key];
        if (isLimit(rs)) continue;
        const cur = s.key === model;
        const Q = rs.q1 + rs.q2, P = rs.p1;
        spec.points.push({
          name: cur ? `${s.name}（目前）` : s.name, x: Q, y: P, symbol: cur ? "diamond" : s.symbol,
          size: cur ? 15 : 12, color: cur ? "--eq" : (s.key === "pc" || s.key === "monopoly" ? "--sw" : "--accent"),
          open: false, text: `<b>${s.name}</b><br>Q = ${f2(Q)}<br>P = ${f2(P)}<br>CS = ${f2(rs.cs)}`
        });
      }
      spec.note = "黑色菱形為目前模型的均衡點，綠色陰影為其消費者剩餘；其餘符號為另外四種市場結構，全部落在同一條需求線上。";
      // 均衡點重合時符號會互相遮住，在說明裡標出來
      const groups = [];
      for (const pt of spec.points) {
        const g0 = groups.find(gp => Math.abs(gp.x - pt.x) < 1e-6 && Math.abs(gp.y - pt.y) < 1e-6);
        if (g0) g0.names.push(pt.name.replace("（目前）", "")); else groups.push({ x: pt.x, y: pt.y, names: [pt.name.replace("（目前）", "")] });
      }
      const overlaps = groups.filter(gp => gp.names.length > 1);
      if (overlaps.length) spec.note += " 重合的點：" + overlaps.map(gp => `${gp.names.join("、")}（Q = ${f2(gp.x)}）`).join("；") + "。";
      return spec;
    }
    // 差異化：廠商 1 的剩餘需求
    const r = res[model];
    spec.xTitle = "廠商 1 產量 q₁"; spec.yTitle = "廠商 1 價格 P₁";
    spec.xs = "q₁"; spec.ys = "P₁";
    if (isLimit(r)) {
      spec.xRange = [0, (a / b) * 1.02]; spec.yRange = [0, a * 1.02];
      spec.note = "此參數組合屬於 limit pricing 區間，未計算均衡，因此不畫剩餘需求。";
      return spec;
    }
    let intercept, slope, label;
    if (model === "bertrand") {          // 對手價格固定在 p₂*
      const D = b * b - g * g;
      intercept = (a * (b - g) + g * r.p2) / b;
      slope = D / b;
      label = `剩餘需求（p₂ 固定 = ${f2(r.p2)}）`;
    } else {                             // 對手產量固定在 q₂*
      intercept = a - g * r.q2;
      slope = b;
      label = `剩餘需求（q₂ 固定 = ${f2(r.q2)}）`;
    }
    const xMax = Math.max(a / b, r.q1 * 1.6, 1e-6);
    spec.xRange = [0, xMax * 1.02]; spec.yRange = [0, Math.max(a, intercept) * 1.02];
    const xEnd = Math.min(xMax * 1.02, intercept / slope);
    spec.lines.push({ name: `廠商 1 ${label}`, color: "--f1", width: 2.5, x: [0, xEnd], y: [intercept, intercept - slope * xEnd] });
    spec.lines.push({ name: `MC₁ = c₁ = ${f2(c1)}`, color: "--f1", dash: "dash", width: 2, x: [0, xMax * 1.02], y: [c1, c1] });
    spec.points.push({ name: "廠商 1 均衡點", x: r.q1, y: r.p1, symbol: "diamond", size: 15, color: "--eq", open: false,
      text: `<b>廠商 1 均衡點</b><br>q₁ = ${f2(r.q1)}<br>P₁ = ${f2(r.p1)}<br>π₁ = ${f2(r.pi1)}` });
    spec.residual = { intercept, slope };
    spec.note = (model === "bertrand"
      ? "差異化產品沒有單一市場需求。這裡畫廠商 1 在對手價格固定時的剩餘需求，比數量競爭時平坦，所以加價空間較小。"
      : "差異化產品沒有單一市場需求。這裡畫廠商 1 在對手產量固定時的剩餘需求。") + "CS 陰影只在同質產品顯示。";
    return spec;
  }
  return { build, STRUCTS };
})();

/* =====================================================================
 * Tests3 — Phase 3 新增計算的測試（不修改 Tests；報告頁另列一節）
 * ===================================================================== */
const Tests3 = (() => {
  const TOL = 0.01;
  const P = (c1, c2, theta = 1, leader = 1) => ({ a: 100, b: 1, c1, c2, theta, leader });
  const close = (x, y, tol = TOL) => Number.isFinite(x) && Number.isFinite(y) && Math.abs(x - y) <= tol;
  const rows = [];
  const add = (group, label, pass, detail) => rows.push({ group, label, pass: !!pass, detail: detail || "" });
  const solveAll = inp => ({
    cournot: Econ.cournot(inp), bertrand: Econ.bertrand(inp), stackelberg: Econ.stackelberg(inp),
    pc: Econ.perfectCompetition(inp), monopoly: Econ.monopoly(inp)
  });
  const shoelace = (xs, ys) => Math.abs(xs.reduce((s, x, k) => {
    const k2 = (k + 1) % xs.length; return s + x * ys[k2] - xs[k2] * ys[k];
  }, 0)) / 2;

  function run() {
    rows.length = 0;

    /* ---- F12 代入算式 ---- */
    const s0 = Subst.get("cournot", P(10, 10))[0];
    add("F12 代入算式", "基準案例與規格範例一致", s0.text === "q₁* = (100 − 2·10 + 10)/(3·1) = 30.00", s0.text);
    const substCases = [];
    for (const [c1, c2, th] of [[10, 10, 1], [10, 25, 1], [10, 10, 0.5], [10, 25, 0.5], [30, 15, 0.8]])
      for (const m of ["cournot", "bertrand", "stackelberg"])
        for (const L of [1, 2]) {
          if (m !== "stackelberg" && L === 2) continue;
          substCases.push({ m, inp: P(c1, c2, th, L) });
        }
    let mism = [];
    for (const { m, inp } of substCases) {
      const r = Econ.solve(m, inp);
      if (r.corner) continue;
      for (const it of Subst.get(m, inp)) if (!close(it.value, it.actual, 1e-6)) mism.push(`${m} ${JSON.stringify(inp)} ${it.text}`);
    }
    add("F12 代入算式", "無角解時，代入結果等於 Econ 實際值", mism.length === 0, mism.length ? mism.slice(0, 2).join("；") : `${substCases.length} 組參數`);
    const cItems = Subst.get("cournot", P(10, 60));
    const q2 = cItems[1];
    add("F12 代入算式", "角解：顯示內部解並註明實際採用 0", q2.value < 0 && q2.actual === 0 && !!q2.note, q2.note || "");
    const bItems = Subst.get("bertrand", P(10, 25));
    add("F12 代入算式", "同質 Bertrand 不對稱：P* → c₂、π₁* = 1,125", close(bItems[1].value, 25) && close(bItems[2].value, 1125), bItems.map(i => i.text).join("｜"));
    const dItems = Subst.get("bertrand", P(10, 10, 0.5));
    add("F12 代入算式", "差異化 Bertrand：k₁ = 60、p₁* = 40", close(dItems[0].value, 60) && close(dItems[2].value, 40), dItems[2].text);
    const sL2 = Subst.get("stackelberg", P(10, 25, 1, 2));
    add("F12 代入算式", "Stackelberg 領導者 = 廠商 2：q₂* = 30、q₁* = 30", sL2[0].text.startsWith("q₂*") && close(sL2[0].value, 30) && close(sL2[1].value, 30), sL2.map(i => i.text).join("｜"));
    let badText = [];
    for (const ps of [{ a: 10, b: 5, c1: 9.5, c2: 0 }, { a: 10, b: 5, c1: 0, c2: 9.5 }, { a: 100, b: 1, c1: 99.5, c2: 99.5 }, { a: 200, b: 0.1, c1: 0, c2: 199 }])
      for (const th of [0, 0.5, 0.95, 1]) for (const m of ["cournot", "bertrand", "stackelberg"]) for (const L of [1, 2])
        for (const it of Subst.get(m, { ...ps, theta: th, leader: L }))
          if (/NaN|Infinity|undefined/.test(it.text + it.tex)) badText.push(`${m} θ=${th}: ${it.text}`);
    add("F12 代入算式", "極端值下算式不含 NaN / Infinity", badText.length === 0, badText.slice(0, 2).join("；"));

    /* ---- F16 等利潤曲線 ---- */
    let worst = 0;
    for (const inp of [P(10, 10), P(10, 25, 0.5), P(20, 5, 0.8)])
      for (const firm of [1, 2]) {
        const piBar = 500;
        for (let k = 1; k <= 20; k++) {
          const qi = k * 3;
          const qj = Iso.quantity(inp, firm, piBar, qi);
          worst = Math.max(worst, Math.abs(Iso.quantityProfit(inp, firm, qi, qj) - piBar));
        }
      }
    add("F16 等利潤曲線", "數量空間：曲線上每點利潤 = π̄", worst < 1e-6, `最大誤差 ${worst.toExponential(1)}`);
    let worstP = 0;
    for (const inp of [P(10, 10, 0.5), P(10, 25, 0.3), P(20, 5, 0.9)])
      for (const firm of [1, 2]) for (let k = 1; k <= 20; k++) {
        const pi = (firm === 1 ? inp.c1 : inp.c2) + k * 2.5;
        const pj = Iso.price(inp, firm, 800, pi);
        worstP = Math.max(worstP, Math.abs(Iso.priceProfit(inp, firm, pi, pj) - 800));
      }
    add("F16 等利潤曲線", "價格空間：曲線上每點利潤 = π̄", worstP < 1e-6, `最大誤差 ${worstP.toExponential(1)}`);
    const cn = Econ.cournot(P(10, 10, 0.5));
    add("F16 等利潤曲線", "Cournot：廠商 1 等利潤曲線在 Nash 點斜率為 0（頂點落在 R₁ 上）",
      Math.abs(Iso.quantitySlope(P(10, 10, 0.5), 1, cn.pi1, cn.q1)) < 1e-9, `斜率 ${Iso.quantitySlope(P(10, 10, 0.5), 1, cn.pi1, cn.q1).toExponential(1)}`);
    const tang = [];
    for (const inp of [P(10, 10, 1, 1), P(10, 25, 1, 2), P(10, 10, 0.5, 1), P(20, 5, 0.8, 2)]) {
      const s = Econ.stackelberg(inp), par = Econ.normalize(inp), L = par.leader;
      const slope = Iso.quantitySlope(inp, L, s[`pi${L}`], s[`q${L}`]);
      const rf = -par.g / (2 * par.b);
      tang.push({ ok: Math.abs(slope - rf) < 1e-9, txt: `L=${L} θ=${inp.theta}: ${slope.toFixed(4)} vs ${rf.toFixed(4)}` });
    }
    add("F16 等利潤曲線", "Stackelberg：領導者等利潤曲線與追隨者反應曲線相切（斜率相同）", tang.every(t => t.ok), tang.map(t => t.txt).join("；"));
    const bd = Econ.bertrand(P(10, 10, 0.5)), h = 1e-5;
    const dslope = (Iso.price(P(10, 10, 0.5), 1, bd.pi1, bd.p1 + h) - Iso.price(P(10, 10, 0.5), 1, bd.pi1, bd.p1 - h)) / (2 * h);
    add("F16 等利潤曲線", "差異化 Bertrand：廠商 1 等利潤曲線在均衡點斜率為 0", Math.abs(dslope) < 1e-4, `斜率 ${dslope.toExponential(1)}`);

    /* ---- F15 市場圖 ---- */
    const csBad = [];
    for (const inp of [P(10, 10), P(10, 25), P(10, 60), P(30, 5)]) {
      const res = solveAll(inp);
      for (const m of ["cournot", "bertrand", "stackelberg"]) {
        const spec = Market.build(inp, res, m);
        const poly = spec.polys[0];
        const area = poly ? shoelace(poly.x, poly.y) : 0;
        if (!close(area, res[m].cs)) csBad.push(`${m} c=${inp.c1}/${inp.c2}: ${area} vs ${res[m].cs}`);
      }
    }
    add("F15 市場圖", "同質：CS 陰影面積 = Econ 的 CS", csBad.length === 0, csBad.slice(0, 2).join("；") || "4 組參數 × 3 個模型");
    const onDemand = [];
    for (const inp of [P(10, 10), P(10, 25), P(10, 60)]) {
      const res = solveAll(inp);
      for (const pt of Market.build(inp, res, "cournot").points)
        if (!close(pt.y, 100 - pt.x, 1e-9)) onDemand.push(`${pt.name} (${pt.x}, ${pt.y})`);
    }
    add("F15 市場圖", "同質：五種市場結構的 (Q, P) 都在需求線 P = a − bQ 上", onDemand.length === 0, onDemand.slice(0, 2).join("；") || "3 組參數 × 5 點");
    const resid = [];
    for (const inp of [P(10, 10, 0.5), P(10, 25, 0.5), P(20, 5, 0.8, 2)]) {
      const res = solveAll(inp);
      for (const m of ["cournot", "bertrand", "stackelberg"]) {
        const spec = Market.build(inp, res, m);
        if (!spec.residual) continue;
        const y = spec.residual.intercept - spec.residual.slope * res[m].q1;
        if (!close(y, res[m].p1, 1e-9)) resid.push(`${m}: ${y} vs ${res[m].p1}`);
      }
    }
    add("F15 市場圖", "差異化：廠商 1 剩餘需求通過其均衡點", resid.length === 0, resid.slice(0, 2).join("；") || "3 組參數 × 3 個模型");

    /* ---- F17 Lerner 與 HHI ---- */
    const cA = Econ.cournot(P(10, 10));
    add("F17 Lerner / HHI", "基準 Cournot：L₁ = L₂ = 0.75、HHI = 5,000", close(cA.lerner.l1, 0.75) && close(cA.lerner.l2, 0.75) && close(cA.hhi, 5000),
      `L₁ ${cA.lerner.l1}、HHI ${cA.hhi}`);
    const lerBad = [];
    for (const [c1, c2] of [[10, 10], [10, 25], [30, 5], [0, 40]]) {
      const r = Econ.cournot(P(c1, c2)), Q = r.q1 + r.q2, eps = r.p1 / (1 * Q);
      for (const i of [1, 2]) if (r[`q${i}`] > 0 && !close(r.lerner[`l${i}`], (r[`q${i}`] / Q) / eps, 1e-9)) lerBad.push(`c=${c1}/${c2} 廠商 ${i}`);
    }
    add("F17 Lerner / HHI", "Cournot 同質：Lᵢ = sᵢ / ε（市占除以需求彈性）", lerBad.length === 0, lerBad.join("；") || "4 組參數");
    const bp = Econ.bertrand(P(10, 10)), mB = Econ.monopoly(P(10, 25));
    add("F17 Lerner / HHI", "Bertrand 悖論 L = 0；獨占 HHI = 10,000", close(bp.lerner.l1, 0) && close(mB.hhi, 10000), `L ${bp.lerner.l1}、HHI ${mB.hhi}`);
    const ex = Econ.cournot(P(10, 60));
    add("F17 Lerner / HHI", "退出廠商的 Lerner 為 0（不出現負值）", ex.lerner.l2 === 0 && ex.lerner.l1 > 0, `L₂ ${ex.lerner.l2}`);

    return { rows: rows.slice(), passed: rows.filter(r => r.pass).length, total: rows.length };
  }
  return { run };
})();

/* =====================================================================
 * State — 介面狀態（單一物件）
 * ===================================================================== */
const State = {
  model: "cournot",              // cournot | bertrand | stackelberg
  product: "homo",               // homo 同質 | diff 差異化
  params: { a: 100, b: 1, c1: 10, c2: 10 },
  thetaDiff: 0.5,                // 差異化模式的 θ；同質模式固定 θ = 1
  leader: 1,                     // F11 Stackelberg 領導者
  compareView: "welfare",        // welfare 福利 | pq 價格與產量 | market 市場圖
  showIso: false,                // F16 等利潤曲線
  preset: "baseline",
  controlsCollapsed: false,
  cdn: { katex: "loading", plotly: "loading" },
  animateNext: false
};

const PARAM_DEFS = [
  { key: "a", sym: "a", zh: "需求截距", en: "Demand intercept", min: () => 10, max: () => 200, step: 1 },
  { key: "b", sym: "b", zh: "需求斜率", en: "Demand slope", min: () => 0.1, max: () => 5, step: 0.1 },
  { key: "c1", sym: "c₁", zh: "廠商 1 邊際成本", en: "Marginal cost", min: () => 0, max: () => State.params.a - 0.5, step: 0.5, firm: 1 },
  { key: "c2", sym: "c₂", zh: "廠商 2 邊際成本", en: "Marginal cost", min: () => 0, max: () => State.params.a - 0.5, step: 0.5, firm: 2 },
  { key: "theta", sym: "θ", zh: "替代程度 γ/b", en: "Substitutability", min: () => 0, max: () => 0.95, step: 0.05, diffOnly: true }
];

const BASE_PARAMS = { a: 100, b: 1, c1: 10, c2: 10 };
const PRESETS = [
  { id: "baseline", zh: "基準", en: "Baseline", model: "cournot", product: "homo", params: { ...BASE_PARAMS } },
  { id: "asym", zh: "成本不對稱", en: "Asymmetric cost", model: "cournot", product: "homo", params: { ...BASE_PARAMS, c2: 25 } },
  { id: "paradox", zh: "Bertrand 悖論", en: "Bertrand paradox", model: "bertrand", product: "homo", params: { ...BASE_PARAMS } },
  { id: "diff", zh: "產品差異化", en: "Differentiation", model: "bertrand", product: "diff", theta: 0.5, params: { ...BASE_PARAMS } },
  { id: "exit", zh: "廠商退出", en: "Exit", model: "cournot", product: "homo", params: { ...BASE_PARAMS, c2: 60 } }
];

const MODELS = {
  cournot: { zh: "Cournot", en: "數量 Quantity" },
  bertrand: { zh: "Bertrand", en: "價格 Price" },
  stackelberg: { zh: "Stackelberg", en: "先後行 Sequential" }
};

const getParam = key => (key === "theta" ? State.thetaDiff : State.params[key]);
const econInput = () => ({
  ...State.params,
  theta: State.product === "homo" ? 1 : State.thetaDiff,
  leader: State.leader
});
// 等利潤曲線只在利潤函數連續且 γ > 0 時有意義
const isoAllowed = () => !(State.model === "bertrand" && State.product === "homo") && Econ.normalize(econInput()).g > 1e-9;

function clampParam(def, v) {
  return Math.min(Math.max(v, def.min()), def.max());
}

function setParam(key, value) {
  if (key === "theta") State.thetaDiff = value;
  else State.params[key] = value;
  if (key === "a") {                                   // 調低 a 時，c 夾到上限
    const cap = State.params.a - 0.5;
    State.params.c1 = Math.min(State.params.c1, cap);
    State.params.c2 = Math.min(State.params.c2, cap);
  }
  State.preset = null;
}

function applyPreset(id) {
  const p = PRESETS.find(x => x.id === id);
  if (!p) return;
  State.model = p.model;
  State.product = p.product;
  State.params = { ...p.params };
  if (p.theta !== undefined) State.thetaDiff = p.theta;
  State.leader = 1;
  State.preset = id;
  State.animateNext = true;
}

/* =====================================================================
 * Lessons — 動畫教學：Cournot 收斂、Bertrand 削價、Stackelberg 先行者優勢
 * 資料由 Econ 純函數產生（可測試）；動畫為自繪 SVG，不依賴任何 CDN。
 * ===================================================================== */
const Lessons = (() => {
  const W = 520, H = 340, M = { l: 48, r: 18, t: 16, b: 42 };
  const BASE_MS = { cournot: 850, bertrand: 140, stackelberg: 55 };
  const S = { tab: "cournot", idx: 0, playing: false, speed: 1, mode: "sequential", lambda: 1, start: [0, 0], lead: 1, sig: "" };
  let root = null, data = null, timer = null;

  const f2 = x => (Number.isFinite(x) ? (Math.abs(x) < 0.005 ? 0 : x).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) : "—");
  const f1 = x => (Number.isFinite(x) ? (+x.toFixed(1)).toString() : "—");
  const esc = s => String(s).replace(/[&<>"]/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[ch]));

  /* ---------- 資料層（純函數，可單獨測試） ---------- */
  function cournotPath(input, opts = {}) {
    return Econ.dynamics("cournot", input, {
      start: opts.start || [0, 0], mode: opts.mode || "sequential", lambda: opts.lambda || 1, maxSteps: 80
    });
  }

  function undercutPath(input) {
    const inp = { ...input, theta: 1 };                         // 悖論只在同質產品出現
    const par = Econ.normalize(inp);
    const pm = (par.a + Math.min(par.c1, par.c2)) / 2;         // 低成本廠商的獨占價
    const d = Econ.dynamics("bertrand", inp, { start: [pm, pm], mode: "sequential", maxSteps: 400 });
    return { ...d, par, pm };
  }

  function homoOutcome(par, p1, p2) {
    const p = Math.min(p1, p2);
    const Q = Math.max(0, (par.a - p) / par.b);
    const s1 = Math.abs(p1 - p2) < 1e-9 ? 0.5 : p1 < p2 ? 1 : 0;
    const s2 = 1 - s1;
    return { p, Q, q1: s1 * Q, q2: s2 * Q, pi1: (p1 - par.c1) * s1 * Q, pi2: (p2 - par.c2) * s2 * Q };
  }

  function stackSweep(input, leader, n = 80) {
    const L = leader === 2 ? 2 : 1, F = L === 1 ? 2 : 1;
    const inp = { ...input, leader: L };
    const par = Econ.normalize(inp);
    const cL = L === 1 ? par.c1 : par.c2, cF = F === 1 ? par.c1 : par.c2;
    const qMax = Math.max((par.a - cL) / par.b, 1e-6);
    const pts = [];
    for (let k = 0; k <= n; k++) {
      const qL = (qMax * k) / n;
      const qF = Econ.reaction.quantity(inp, F, qL);
      const PL = par.a - par.b * qL - par.g * qF;
      const PF = par.a - par.b * qF - par.g * qL;
      pts.push({ qL, qF, PL, PF, piL: (PL - cL) * qL, piF: (PF - cF) * qF });
    }
    let best = 0;
    pts.forEach((p, i) => { if (p.piL > pts[best].piL) best = i; });
    return { pts, best, qMax, L, F, par, eq: Econ.stackelberg(inp), co: Econ.cournot(inp) };
  }

  /* ---------- SVG 小工具 ---------- */
  const niceStep = raw => {
    const e = Math.pow(10, Math.floor(Math.log10(raw || 1)));
    const m = raw / e;
    return (m <= 1 ? 1 : m <= 2 ? 2 : m <= 5 ? 5 : 10) * e;
  };
  function frame(xmax, ymax, xl, yl) {
    const X = v => M.l + (v / xmax) * (W - M.l - M.r);
    const Y = v => H - M.b - (v / ymax) * (H - M.t - M.b);
    let g = "";
    const sx = niceStep(xmax / 5), sy = niceStep(ymax / 5);
    for (let v = 0; v <= xmax + 1e-9; v += sx)
      g += `<line x1="${X(v)}" y1="${M.t}" x2="${X(v)}" y2="${H - M.b}" class="gl"/><text x="${X(v)}" y="${H - M.b + 15}" text-anchor="middle">${+v.toFixed(2)}</text>`;
    for (let v = 0; v <= ymax + 1e-9; v += sy)
      g += `<line x1="${M.l}" y1="${Y(v)}" x2="${W - M.r}" y2="${Y(v)}" class="gl"/><text x="${M.l - 6}" y="${Y(v) + 4}" text-anchor="end">${+v.toFixed(2)}</text>`;
    g += `<text x="${(M.l + W - M.r) / 2}" y="${H - 6}" text-anchor="middle" class="axl">${esc(xl)}</text>`;
    g += `<text x="12" y="${(M.t + H - M.b) / 2}" text-anchor="middle" class="axl" transform="rotate(-90 12 ${(M.t + H - M.b) / 2})">${esc(yl)}</text>`;
    return { X, Y, g, clip: `<clipPath id="ls-clip"><rect x="${M.l}" y="${M.t}" width="${W - M.l - M.r}" height="${H - M.t - M.b}"/></clipPath>` };
  }
  const poly = (pts, X, Y, cls, extra = "") =>
    `<polyline class="${cls}" ${extra} points="${pts.map(p => `${X(p[0]).toFixed(1)},${Y(p[1]).toFixed(1)}`).join(" ")}"/>`;
  const dot = (x, y, cls, r = 5) => `<circle class="${cls}" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${r}"/>`;

  /* ---------- 建立目前教學的資料 ---------- */
  function rebuild() {
    const inp = econInput();
    S.idx = 0; stop();
    if (S.tab === "cournot") {
      data = { kind: "cournot", inp, res: cournotPath(inp, { start: S.start, mode: S.mode, lambda: S.lambda }), nash: Econ.cournot(inp) };
      data.N = data.res.path.length - 1;
    } else if (S.tab === "bertrand") {
      data = { kind: "bertrand", inp, res: undercutPath(inp) };
      data.N = data.res.path.length - 1;
    } else {
      data = { kind: "stackelberg", inp, sw: stackSweep(inp, S.lead) };
      data.N = data.sw.pts.length - 1;
    }
  }

  /* ---------- 各教學的畫面 ---------- */
  function viewCournot() {
    const { inp, res, nash } = data, par = Econ.normalize(inp);
    const ax = Math.max(par.a / par.b, 1);
    const fr = frame(ax, ax, "廠商 1 產量 q₁ Output of Firm 1", "廠商 2 產量 q₂");
    const { X, Y } = fr;
    const N = 60, r1 = [], r2 = [];
    for (let k = 0; k <= N; k++) {
      const v = (ax * k) / N;
      r1.push([Econ.reaction.quantity(inp, 1, v), v]);
      r2.push([v, Econ.reaction.quantity(inp, 2, v)]);
    }
    const pts = res.path.slice(0, S.idx + 1);
    const cur = pts[pts.length - 1];
    const prev = pts[pts.length - 2];
    let svg = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Cournot 最適反應收斂動畫">${fr.clip}${fr.g}
      <g clip-path="url(#ls-clip)">${poly(r1, X, Y, "ln f1")}${poly(r2, X, Y, "ln f2")}</g>
      <text x="${W - M.r - 4}" y="${M.t + 12}" text-anchor="end" class="lab f1t">R₁(q₂)</text>
      <text x="${W - M.r - 4}" y="${M.t + 26}" text-anchor="end" class="lab f2t">R₂(q₁)</text>
      ${poly(pts.map(p => [p.x1, p.x2]), X, Y, "ln path")}
      ${pts.map(p => dot(X(p.x1), Y(p.x2), "pt", 2.6)).join("")}
      ${dot(X(res.path[0].x1), Y(res.path[0].x2), "start", 6)}
      <text x="${X(res.path[0].x1) + 9}" y="${Y(res.path[0].x2) - 7}" class="lab">起點</text>
      ${dot(X(nash.q1), Y(nash.q2), "nash", 8)}
      ${dot(X(cur.x1), Y(cur.x2), "now", 6)}</svg>`;
    let say;
    if (S.idx === 0) say = `起點：廠商 1 產出 <b>${f2(cur.x1)}</b>、廠商 2 產出 <b>${f2(cur.x2)}</b>。按「播放」，看兩家怎麼互相調整。`;
    else if (S.mode === "sequential") {
      const who = S.idx % 2 === 1 ? 1 : 2;
      const opp = who === 1 ? prev.x2 : prev.x1, mine = who === 1 ? cur.x1 : cur.x2;
      say = `第 ${S.idx} 步：廠商 ${who} 看到對手產出 ${f2(opp)}，把自己調整成最適反應 <b>${f2(mine)}</b>（Best response）。`;
    } else say = `第 ${S.idx} 步：兩家同時以對手上一步的產出為給定，各自調整到 <b>(${f2(cur.x1)}, ${f2(cur.x2)})</b>。`;
    if (S.idx === data.N) {
      say += res.converged
        ? ` <b>第 ${res.steps} 步收斂 Converged</b>，停在兩條反應曲線的交點，即 Cournot–Nash 均衡 (${f2(nash.q1)}, ${f2(nash.q2)})：價格 ${f2(nash.p1)}，利潤 ${f2(nash.pi1)} / ${f2(nash.pi2)}。`
        : ` 已達 ${data.N} 步，仍接近均衡 (${f2(nash.q1)}, ${f2(nash.q2)})。`;
    }
    const rows = pts.slice(-6).map(p => {
      const a1 = p.x1, a2 = p.x2;
      const pr1 = par.a - par.b * a1 - par.g * a2, pr2 = par.a - par.b * a2 - par.g * a1;
      return `<tr><td>${p.t}</td><td>${f2(a1)}</td><td>${f2(a2)}</td><td>${f2((pr1 - par.c1) * a1)}</td><td>${f2((pr2 - par.c2) * a2)}</td></tr>`;
    }).join("");
    const table = `<table class="ls-table"><thead><tr><th>步 t</th><th>q₁</th><th>q₂</th><th>π₁</th><th>π₂</th></tr></thead><tbody>${rows}</tbody></table>`;
    return `<div class="ls-grid"><div class="ls-chart">${svg}<p class="note">小提示：點圖上任一處可以更換起點。</p></div><div class="ls-side"><p class="ls-say" aria-live="polite">${say}</p>${table}</div></div>`;
  }

  function viewBertrand() {
    const { res } = data, par = res.par, path = res.path;
    const N = data.N, cur = path[S.idx];
    const ymax = Math.max(res.pm * 1.08, 1);
    const fr = frame(Math.max(N, 1), ymax, "步數 Step", "價格 Price");
    const { X, Y } = fr;
    const sl = path.slice(0, S.idx + 1);
    const o = homoOutcome(par, cur.x1, cur.x2);
    const cl = (c, txt, cls, left) => `<line x1="${M.l}" y1="${Y(c)}" x2="${W - M.r}" y2="${Y(c)}" class="ln ${cls}"/><text x="${left ? M.l + 6 : W - M.r - 4}" y="${Y(c) - 5}" text-anchor="${left ? "start" : "end"}" class="lab">${txt}</text>`;
    let svg = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Bertrand 削價動畫">${fr.clip}${fr.g}
      ${cl(res.pm, `獨占價 ${f2(res.pm)}`, "ref")}
      ${par.c1 === par.c2 ? cl(par.c1, `邊際成本 ${f2(par.c1)}`, "ref", true) : cl(par.c1, `c₁ ${f2(par.c1)}`, "ref", true) + cl(par.c2, `c₂ ${f2(par.c2)}`, "ref", true)}
      ${poly(sl.map(p => [p.t, p.x2]), X, Y, "ln f2 dash")}
      ${poly(sl.map(p => [p.t, p.x1]), X, Y, "ln f1")}
      ${dot(X(cur.t), Y(cur.x2), "now f2d", 5)}${dot(X(cur.t), Y(cur.x1), "now f1d", 4)}</svg>`;
    let say;
    if (S.idx === 0) say = `起點：兩家都訂獨占價 <b>${f2(cur.x1)}</b>，各分一半市場。按「播放」：只要比對手低一點，就能搶走整個市場。`;
    else {
      const who = S.idx % 2 === 1 ? 1 : 2;
      say = `第 ${S.idx} 步：廠商 ${who} 比對手便宜 1 單位（教學用 ε = 1），拿下整個市場。價格 ${f2(cur.x1)} / ${f2(cur.x2)}。`;
    }
    if (S.idx === data.N) {
      say += par.c1 === par.c2
        ? ` <b>價格被壓到邊際成本 ${f2(par.c1)}，利潤為 0</b>：只要兩家就足以做到完全競爭價格，這就是 Bertrand 悖論 Bertrand paradox。`
        : ` 低成本廠商把價格壓到略低於高成本廠商的成本 ${f2(Math.max(par.c1, par.c2))}，獨拿市場；高成本廠商利潤為 0。`;
    }
    const stat = `<table class="ls-table"><thead><tr><th></th><th>廠商 1</th><th>廠商 2</th></tr></thead><tbody>
      <tr><td>價格 Price</td><td>${f2(cur.x1)}</td><td>${f2(cur.x2)}</td></tr>
      <tr><td>產量 Output</td><td>${f2(o.q1)}</td><td>${f2(o.q2)}</td></tr>
      <tr><td>利潤 Profit</td><td>${f2(o.pi1)}</td><td>${f2(o.pi2)}</td></tr></tbody></table>`;
    return `<div class="ls-grid"><div class="ls-chart">${svg}<p class="note">此動畫固定用「同質產品」（θ = 1），與上方產品型態設定無關；成本與需求沿用左側參數。</p></div><div class="ls-side"><p class="ls-say" aria-live="polite">${say}</p>${stat}</div></div>`;
  }

  function viewStackelberg() {
    const { sw } = data, pts = sw.pts, cur = pts[S.idx], par = sw.par, L = sw.L, F = sw.F;
    // 左：反應平面（領導者產量在橫軸，追隨者在縱軸，與領導者編號無關，教學較直觀）
    const ax = Math.max(par.a / par.b, 1);
    const f1 = frame(ax, ax, `領導者（廠商 ${L}）產量 q_L`, `追隨者（廠商 ${F}）產量 q_F`);
    const N = 60, rf = [];
    const inp = { ...data.inp, leader: L };
    for (let k = 0; k <= N; k++) { const v = (ax * k) / N; rf.push([v, Econ.reaction.quantity(inp, F, v)]); }
    const co = sw.co, eq = sw.eq;
    const coL = L === 1 ? co.q1 : co.q2, coF = F === 1 ? co.q1 : co.q2;
    const eqL = L === 1 ? eq.q1 : eq.q2, eqF = F === 1 ? eq.q1 : eq.q2;
    const A = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="追隨者反應曲線與領導者承諾">${f1.clip}${f1.g}
      <g clip-path="url(#ls-clip)">${poly(rf, f1.X, f1.Y, "ln " + (F === 1 ? "f1" : "f2"))}</g>
      <line x1="${f1.X(cur.qL)}" y1="${M.t}" x2="${f1.X(cur.qL)}" y2="${H - M.b}" class="ln commit ${L === 1 ? "f1" : "f2"}"/>
      ${dot(f1.X(coL), f1.Y(coF), "nash", 7)}<text x="${f1.X(coL) + 10}" y="${f1.Y(coF) + 4}" class="lab">Cournot</text>
      ${S.idx >= sw.best ? dot(f1.X(eqL), f1.Y(eqF), "star", 7) + `<text x="${f1.X(eqL) + 10}" y="${f1.Y(eqF) - 6}" class="lab strong">Stackelberg</text>` : ""}
      ${dot(f1.X(cur.qL), f1.Y(cur.qF), "now", 6)}</svg>`;
    // 右：領導者利潤曲線
    const pmax = Math.max(...pts.map(p => p.piL), 1) * 1.1;
    const f2c = frame(sw.qMax, pmax, `領導者產量 q_L`, "領導者利潤 π_L");
    const prof = pts.slice(0, S.idx + 1).map(p => [p.qL, Math.max(p.piL, 0)]);
    const coPi = L === 1 ? co.pi1 : co.pi2;
    const B = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="領導者利潤曲線">${f2c.clip}${f2c.g}
      <g clip-path="url(#ls-clip)"><line x1="${M.l}" y1="${f2c.Y(coPi)}" x2="${W - M.r}" y2="${f2c.Y(coPi)}" class="ln ref"/></g>
      <text x="${W - M.r - 4}" y="${f2c.Y(coPi) - 5}" text-anchor="end" class="lab">Cournot 利潤 ${f2(coPi)}</text>
      ${poly(prof, f2c.X, f2c.Y, "ln " + (L === 1 ? "f1" : "f2"))}
      ${S.idx >= sw.best ? dot(f2c.X(pts[sw.best].qL), f2c.Y(pts[sw.best].piL), "star", 7) : ""}
      ${dot(f2c.X(cur.qL), f2c.Y(Math.max(cur.piL, 0)), "now", 6)}</svg>`;
    let say;
    if (S.idx === 0) say = `領導者（廠商 ${L}）先承諾產量，追隨者看到後才依反應曲線回應。按「播放」：把領導者的承諾量從 0 慢慢加大。`;
    else say = `領導者承諾 q_L = <b>${f2(cur.qL)}</b>，追隨者最適回應 q_F = <b>${f2(cur.qF)}</b>，價格 ${f2(cur.PL)}。領導者利潤 <b>${f2(cur.piL)}</b>，追隨者 ${f2(cur.piF)}。`;
    if (S.idx === data.N) say = `掃描完成。利潤最高點在 q_L ≈ ${f2(pts[sw.best].qL)}，就是 Stackelberg 均衡（理論值 ${f2(eqL)}）：領導者利潤 ${f2(L === 1 ? eq.pi1 : eq.pi2)}，高於 Cournot 的 ${f2(coPi)}，這就是先行者優勢 First-mover advantage。`;
    return `<div class="ls-grid two"><div class="ls-chart">${A}</div><div class="ls-chart">${B}</div></div><p class="ls-say" aria-live="polite">${say}</p>`;
  }

  /* ---------- 控制與繪製 ---------- */
  const INTRO = {
    cournot: ["動畫 1｜Cournot：互相猜測，一步步走向均衡", "每一步，廠商把對手目前的產量當成給定，改成自己的最適反應 Best response。路徑一步步逼近兩條反應曲線的交點 Nash 均衡。反應曲線斜率的絕對值 γ/(2b) ≤ ½ < 1，所以一定收斂。"],
    bertrand: ["動畫 2｜Bertrand 悖論：削價把價格壓到成本", "產品完全相同時，只要價格比對手低一點，就能搶走整個市場。兩家輪流削價，價格最後被壓到邊際成本，利潤為 0。"],
    stackelberg: ["動畫 3｜Stackelberg：先承諾者的優勢", "領導者先承諾產量，追隨者再回應。左圖是追隨者的反應曲線，右圖是領導者的利潤：把承諾量逐步加大，利潤先升後降，最高點就是 Stackelberg 均衡。"]
  };

  function extraHTML() {
    if (S.tab === "cournot") return `
      <span class="ls-lbl">更新方式</span>
      <button type="button" class="btn small" data-ls-mode="sequential" aria-pressed="${S.mode === "sequential"}">輪流 Sequential</button>
      <button type="button" class="btn small" data-ls-mode="simultaneous" aria-pressed="${S.mode === "simultaneous"}">同時 Simultaneous</button>
      <span class="ls-lbl">調整速度 λ</span>
      <button type="button" class="btn small" data-ls-lambda="1" aria-pressed="${S.lambda === 1}">1（完全）</button>
      <button type="button" class="btn small" data-ls-lambda="0.5" aria-pressed="${S.lambda === 0.5}">0.5（部分）</button>
      <span class="ls-lbl">起點</span>
      <button type="button" class="btn small" data-ls-start="0,0">(0, 0)</button>
      <button type="button" class="btn small" data-ls-start="high">高產量</button>`;
    if (S.tab === "stackelberg") return `
      <span class="ls-lbl">領導者</span>
      <button type="button" class="btn small" data-ls-lead="1" aria-pressed="${S.lead === 1}">廠商 1</button>
      <button type="button" class="btn small" data-ls-lead="2" aria-pressed="${S.lead === 2}">廠商 2</button>`;
    return "";
  }

  function shell() {
    root.innerHTML = `
      <div class="card-head"><h2 id="ls-title">動畫教學 <span class="en">Animated lessons</span></h2>
        <div class="ls-tabs" role="tablist" aria-label="選擇動畫">
          <button type="button" role="tab" class="btn" data-ls-tab="cournot">① Cournot 收斂</button>
          <button type="button" role="tab" class="btn" data-ls-tab="bertrand">② Bertrand 削價</button>
          <button type="button" role="tab" class="btn" data-ls-tab="stackelberg">③ Stackelberg 先行者</button>
        </div></div>
      <h3 class="ls-h" id="ls-h"></h3><p class="note ls-intro" id="ls-intro"></p>
      <div class="ls-controls">
        <button type="button" class="btn primary" id="ls-play">▶ 播放 Play</button>
        <button type="button" class="btn" id="ls-step">⏭ 單步 Step</button>
        <button type="button" class="btn" id="ls-reset">↺ 重設 Reset</button>
        <label class="ls-lbl" for="ls-speed">速度</label>
        <select id="ls-speed" class="ls-select"><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option><option value="4">4×</option></select>
      </div>
      <div class="ls-controls" id="ls-extra"></div>
      <div class="ls-scrub"><input type="range" id="ls-scrub" min="0" max="1" value="0" step="1" aria-label="動畫進度 Progress"><span id="ls-prog" class="note"></span></div>
      <div id="ls-view"></div>`;
  }

  function draw() {
    if (!root || !data) return;
    root.querySelectorAll("[data-ls-tab]").forEach(b => { b.setAttribute("aria-pressed", String(b.dataset.lsTab === S.tab)); b.setAttribute("aria-selected", String(b.dataset.lsTab === S.tab)); });
    const [h, intro] = INTRO[S.tab];
    root.querySelector("#ls-h").textContent = h;
    root.querySelector("#ls-intro").textContent = intro;
    root.querySelector("#ls-extra").innerHTML = extraHTML();
    const sc = root.querySelector("#ls-scrub");
    sc.max = data.N; sc.value = S.idx;
    root.querySelector("#ls-prog").textContent = `${S.idx} / ${data.N}`;
    root.querySelector("#ls-play").textContent = S.playing ? "⏸ 暫停 Pause" : S.idx >= data.N ? "↻ 重播 Replay" : "▶ 播放 Play";
    root.querySelector("#ls-view").innerHTML =
      data.kind === "cournot" ? viewCournot() : data.kind === "bertrand" ? viewBertrand() : viewStackelberg();
  }

  function stop() { S.playing = false; if (timer) { clearTimeout(timer); timer = null; } }
  function tick() {
    if (!S.playing) return;
    if (S.idx >= data.N) { stop(); draw(); return; }
    S.idx += 1; draw();
    if (S.idx >= data.N) { stop(); draw(); return; }
    timer = setTimeout(tick, BASE_MS[S.tab] / S.speed);
  }
  function play() {
    if (S.playing) { stop(); draw(); return; }
    if (S.idx >= data.N) S.idx = 0;
    S.playing = true; draw();
    timer = setTimeout(tick, 250);
  }

  function signature() { return JSON.stringify([econInput(), S.tab, S.mode, S.lambda, S.start, S.lead]); }
  function refresh(force) {
    if (!root) return;
    const sig = signature();
    if (!force && sig === S.sig && data) return;      // 參數沒變就不打斷動畫
    S.sig = sig; rebuild(); draw();
  }

  function mount(el) {
    root = el; shell();
    root.addEventListener("click", e => {
      const t = e.target.closest("button");
      const svg = e.target.closest("svg");
      if (t) {
        if (t.dataset.lsTab) { S.tab = t.dataset.lsTab; refresh(true); }
        else if (t.dataset.lsMode) { S.mode = t.dataset.lsMode; refresh(true); }
        else if (t.dataset.lsLambda) { S.lambda = Number(t.dataset.lsLambda); refresh(true); }
        else if (t.dataset.lsStart) {
          const par = Econ.normalize(econInput());
          S.start = t.dataset.lsStart === "high" ? [par.a / par.b * 0.9, par.a / par.b * 0.05] : [0, 0]; refresh(true);
        }
        else if (t.dataset.lsLead) { S.lead = Number(t.dataset.lsLead); refresh(true); }
        else if (t.id === "ls-play") play();
        else if (t.id === "ls-step") { stop(); if (S.idx < data.N) S.idx += 1; draw(); }
        else if (t.id === "ls-reset") { stop(); S.idx = 0; draw(); }
        return;
      }
      if (svg && data && data.kind === "cournot" && svg.closest(".ls-chart")) {       // 點圖設定起點
        const r = svg.getBoundingClientRect();
        const par = Econ.normalize(econInput()), ax = Math.max(par.a / par.b, 1);
        const px = ((e.clientX - r.left) / r.width) * W, py = ((e.clientY - r.top) / r.height) * H;
        const q1 = ((px - M.l) / (W - M.l - M.r)) * ax, q2 = ((H - M.b - py) / (H - M.t - M.b)) * ax;
        if (q1 >= 0 && q1 <= ax && q2 >= 0 && q2 <= ax) { S.start = [q1, q2]; refresh(true); }
      }
    });
    root.addEventListener("input", e => {
      if (e.target.id === "ls-scrub") { stop(); S.idx = Number(e.target.value); draw(); }
      else if (e.target.id === "ls-speed") { S.speed = Number(e.target.value); }
    });
    refresh(true);
  }

  /* ---------- 自我測試（?test=1 顯示） ---------- */
  function selfTest() {
    const rows = [], close = (x, y, t = 0.5) => Number.isFinite(x) && Math.abs(x - y) <= t;
    const add = (label, pass, detail) => rows.push({ group: "動畫教學 Lessons", label, pass: !!pass, detail: detail || "" });
    const A = { a: 100, b: 1, c1: 10, c2: 10, theta: 1 };
    const c = cournotPath(A, { start: [0, 0], mode: "sequential" });
    const last = c.path[c.path.length - 1];
    add("動畫 1：輪流更新從 (0,0) 收斂到 (30,30)", c.converged && close(last.x1, 30) && close(last.x2, 30), `步數 ${c.steps}，終點 (${f2(last.x1)}, ${f2(last.x2)})`);
    const cs = cournotPath(A, { start: [0, 0], mode: "simultaneous" });
    add("動畫 1：同時更新 15 步內收斂", cs.converged && cs.steps <= 15, `步數 ${cs.steps}`);
    const c3 = cournotPath({ ...A, theta: 0.5 }, { start: [80, 5], mode: "sequential" });
    const l3 = c3.path[c3.path.length - 1];
    add("動畫 1：差異化 θ=0.5 從 (80,5) 收斂到 (36,36)", c3.converged && close(l3.x1, 36) && close(l3.x2, 36), `(${f2(l3.x1)}, ${f2(l3.x2)})`);
    const u = undercutPath(A), ul = u.path[u.path.length - 1];
    add("動畫 2：削價終點 = 邊際成本 10，利潤 0", u.converged && close(ul.x1, 10, 1e-6) && close(ul.x2, 10, 1e-6) && homoOutcome(u.par, ul.x1, ul.x2).pi1 === 0, `步數 ${u.steps}，價格 ${f2(ul.x1)}`);
    const u2 = undercutPath({ ...A, c2: 25 }), u2l = u2.path[u2.path.length - 1];
    add("動畫 2：成本 10 / 25，低成本廠商壓到高成本廠商成本附近", u2.converged && close(Math.min(u2l.x1, u2l.x2), 24, 1.01), `價格 ${f2(u2l.x1)} / ${f2(u2l.x2)}`);
    const s = stackSweep(A, 1);
    add("動畫 3：領導者利潤最高點 ≈ Stackelberg 均衡 q_L = 45", close(s.pts[s.best].qL, s.eq.q1, 1.0) && close(s.pts[s.best].piL, s.eq.pi1, 5), `掃描最佳 q_L ${f2(s.pts[s.best].qL)}、理論 ${f2(s.eq.q1)}`);
    add("動畫 3：領導者利潤高於 Cournot（先行者優勢）", s.eq.pi1 > s.co.pi1, `${f2(s.eq.pi1)} > ${f2(s.co.pi1)}`);
    const s2 = stackSweep({ ...A, c2: 25 }, 2);
    add("動畫 3：廠商 2 當領導者也一致", close(s2.pts[s2.best].qL, s2.eq.q2, 1.0), `掃描 ${f2(s2.pts[s2.best].qL)}、理論 ${f2(s2.eq.q2)}`);
    return { rows, passed: rows.filter(r => r.pass).length, total: rows.length };
  }

  return { mount, refresh, selfTest, cournotPath, undercutPath, stackSweep, homoOutcome };
})();

/* =====================================================================
 * Render — 讀 State 繪製；任何變動只呼叫 Render.schedule()
 * ===================================================================== */
const Render = (() => {
  const $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/[&<>"]/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[ch]));
  const fmt = x => {
    if (!Number.isFinite(x)) return "—";
    const v = Math.abs(x) < 0.005 ? 0 : x;
    return v.toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  };
  const fmtInt = x => (Number.isFinite(x) ? Math.round(x).toLocaleString("en-US") : "—");
  const fmtParam = v => String(Math.round(v * 1000) / 1000);
  const linspace = (lo, hi, n) => Array.from({ length: n }, (_, k) => lo + ((hi - lo) * k) / (n - 1));
  const sortedUnique = arr => [...new Set(arr.map(v => +v.toFixed(9)))].sort((x, y) => x - y);
  const katexOk = () => State.cdn.katex === "ok" && typeof window.katex !== "undefined";
  const plotlyOk = () => State.cdn.plotly === "ok" && typeof window.Plotly !== "undefined";
  const css = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  const isLimit = r => !!(r.corner && r.corner.computed === false);
  const alpha = (hex, a) => {
    const m = /^#?([0-9a-f]{2})([0-9a-f]{2})([0-9a-f]{2})$/i.exec(hex);
    return m ? `rgba(${parseInt(m[1], 16)},${parseInt(m[2], 16)},${parseInt(m[3], 16)},${a})` : hex;
  };

  let pending = false;
  function schedule() {
    if (pending) return;
    pending = true;
    requestAnimationFrame(() => { pending = false; render(); });
  }

  function solveAll() {
    const inp = econInput();
    return {
      cournot: Econ.cournot(inp), bertrand: Econ.bertrand(inp), stackelberg: Econ.stackelberg(inp),
      pc: Econ.perfectCompetition(inp), monopoly: Econ.monopoly(inp)
    };
  }

  function render() {
    const res = solveAll();
    renderControls();
    renderCdnBanner();
    renderResults(res);
    renderReaction(res);
    renderComparison(res);
    renderTheory();
    renderSubst();
    Lessons.refresh();
    State.animateNext = false;
  }

  /* ---------- 控制欄 Controls ---------- */
  function renderControls() {
    for (const def of PARAM_DEFS) {
      const wrap = document.querySelector(`.param[data-key="${def.key}"]`);
      if (!wrap) continue;
      wrap.hidden = !!def.diffOnly && State.product === "homo";
      const rng = $(`rng-${def.key}`), num = $(`num-${def.key}`);
      const v = getParam(def.key), lo = def.min(), hi = def.max();
      rng.min = lo; rng.max = hi; rng.step = def.step;
      rng.value = v;
      rng.style.setProperty("--pct", `${hi > lo ? ((Math.min(Math.max(v, lo), hi) - lo) / (hi - lo)) * 100 : 0}%`);
      if (document.activeElement !== num) num.value = fmtParam(v);
      wrap.querySelector(".min").textContent = fmtParam(lo);
      wrap.querySelector(".max").textContent = fmtParam(hi);
    }
    const sel = (q, attr, val) => document.querySelectorAll(q).forEach(b => b.setAttribute(attr, String(val(b))));
    sel("[data-model]", "aria-selected", b => b.dataset.model === State.model);
    sel("[data-product]", "aria-pressed", b => b.dataset.product === State.product);
    sel("[data-preset]", "aria-pressed", b => b.dataset.preset === State.preset);
    sel("[data-view]", "aria-pressed", b => b.dataset.view === State.compareView);
    sel("[data-leader]", "aria-pressed", b => Number(b.dataset.leader) === State.leader);
    $("leader-group").hidden = State.model !== "stackelberg";
    const iso = $("iso-toggle"), allowed = isoAllowed();
    iso.disabled = !allowed;
    iso.setAttribute("aria-pressed", String(allowed && State.showIso));
    iso.title = allowed ? "在反應曲線圖上顯示等利潤曲線 Isoprofit curves"
      : (State.model === "bertrand" && State.product === "homo"
        ? "同質 Bertrand 的利潤函數不連續，沒有平滑的等利潤曲線"
        : "θ = 0 時對手策略不影響利潤，等利潤曲線退化為直線");
    $("controls").classList.toggle("collapsed", State.controlsCollapsed);
    $("controls-toggle").setAttribute("aria-expanded", String(!State.controlsCollapsed));
  }

  /* ---------- CDN 備援提示 ---------- */
  function renderCdnBanner() {
    const failed = [];
    if (State.cdn.katex === "fail") failed.push("KaTeX（公式改以純文字顯示 Formulas shown as plain text）");
    if (State.cdn.plotly === "fail") failed.push("Plotly（反應曲線與市場圖改用簡化圖、長條圖改看表格 Simplified charts）");
    const el = $("cdn-banner");
    el.hidden = failed.length === 0;
    if (failed.length) {
      el.innerHTML = `<strong>外部函式庫載入失敗 External library failed to load：</strong>${failed.map(esc).join("；")}。` +
        `數值計算與其他功能不受影響 All calculations still work.`;
    }
  }

  /* ---------- 結果面板 F05 ＋ 角解提示 F07 ＋ Lerner / HHI F17 ---------- */
  function renderResults(res) {
    const r = res[State.model];
    const limit = isLimit(r);
    const leaderTxt = State.model === "stackelberg" ? `，領導者＝廠商 ${State.leader}` : "";
    $("results-title").innerHTML = `結果 Results <span class="en">— ${esc(MODELS[State.model].zh)}${State.product === "diff" ? "（差異化）" : ""}${leaderTxt}</span>`;

    const banner = $("corner-banner");
    banner.hidden = !r.corner;
    if (r.corner) banner.innerHTML = `${esc(r.corner.msgZh)}<span class="en-line">${esc(r.corner.msgEn)}</span>`;

    const rows = [];
    if (State.product === "homo") rows.push(["價格 Price", "P", r.p1, 0]);
    else rows.push(["廠商 1 價格", "P₁", r.p1, 1], ["廠商 2 價格", "P₂", r.p2, 2]);
    rows.push(
      ["廠商 1 產量 Output", "q₁", r.q1, 1, "top"], ["廠商 2 產量 Output", "q₂", r.q2, 2], ["總產量 Total", "Q", r.q1 + r.q2, 0],
      ["廠商 1 利潤 Profit", "π₁", r.pi1, 1, "top"], ["廠商 2 利潤 Profit", "π₂", r.pi2, 2],
      ["消費者剩餘 Consumer surplus", "CS", r.cs, 0, "top"], ["社會福利 Social welfare", "SW", r.sw, 0], ["無謂損失 Deadweight loss", "DWL", r.dwl, 0],
      ["廠商 1 勒納指數 Lerner", "L₁", r.lerner.l1, 1, "top"], ["廠商 2 勒納指數 Lerner", "L₂", r.lerner.l2, 2],
      ["赫芬達爾指數 HHI", "HHI", r.hhi, 0, null, "int"]
    );
    const exited = firm => !limit && firm > 0 && r[`q${firm}`] === 0;
    $("results").innerHTML = rows.map(([label, sym, val, firm, top, kind]) => {
      const cls = [exited(firm) ? "exited" : "", top ? "group-top" : ""].filter(Boolean).join(" ");
      const dot = firm ? `<span class="dot f${firm}"></span>` : "";
      return `<dt class="${cls}">${dot}${esc(label)} <span class="sym">${esc(sym)}</span></dt>` +
             `<dd class="${cls}">${limit ? "—" : kind === "int" ? fmtInt(val) : fmt(val)}</dd>`;
    }).join("");
  }

  /* ---------- 通用繪圖：同一份規格可畫成 Plotly 或 SVG ----------
   * spec = { xs, ys, xTitle, yTitle, xRange, yRange,
   *          lines:[{name,color,dash,width,x,y,customdata,hover}], polys:[{name,color,x,y}],
   *          points:[{name,x,y,symbol,size,color,open,text}], note }
   * 顏色一律用 CSS 變數名稱（如 "--f1"），深色模式自動切換。 */
  const PLOT_CONFIG = { responsive: true, displayModeBar: false };
  const TRANSITION_MS = 300;

  function baseLayout(el) {
    return {
      height: el.clientHeight || undefined,
      margin: { l: 56, r: 12, t: 8, b: 48 },
      paper_bgcolor: "rgba(0,0,0,0)", plot_bgcolor: "rgba(0,0,0,0)",
      font: { family: getComputedStyle(document.body).fontFamily, color: css("--fg"), size: 12 },
      hoverlabel: { font: { size: 12 } },
      legend: { orientation: "h", x: 0, xanchor: "left", y: -0.16, yanchor: "top", font: { size: 11 } },
      hovermode: "closest"
    };
  }

  function axis(title, range) {
    return {
      title: { text: title, standoff: 8 }, range, fixedrange: true,
      gridcolor: css("--grid"), zerolinecolor: css("--line"), linecolor: css("--line"), automargin: true
    };
  }

  function specTraces(spec) {
    const traces = [];
    for (const p of spec.polys) {
      traces.push({ type: "scatter", mode: "lines", name: p.name, x: p.x, y: p.y, fill: "toself",
        fillcolor: alpha(css(p.color), 0.22), line: { width: 0, color: css(p.color) },
        hovertemplate: `<b>${p.name}</b><extra></extra>` });
    }
    for (const l of spec.lines) {
      traces.push({ type: "scatter", mode: "lines", name: l.name, x: l.x, y: l.y, connectgaps: false,
        line: { color: css(l.color), width: l.width || 2.5, dash: l.dash || "solid" }, customdata: l.customdata,
        hovertemplate: l.hover || `<b>${l.name}</b><br>${spec.xs} = %{x:,.2f}<br>${spec.ys} = %{y:,.2f}<extra></extra>` });
    }
    for (const p of spec.points) {
      traces.push({ type: "scatter", mode: "markers", name: p.name, x: [p.x], y: [p.y], text: [p.text],
        hovertemplate: "%{text}<extra></extra>",
        marker: p.open
          ? { size: p.size, symbol: p.symbol, color: "rgba(0,0,0,0)", line: { color: css(p.color), width: 2 } }
          : { size: p.size, symbol: p.symbol, color: css(p.color), line: { color: css("--bg"), width: 1.5 } } });
    }
    return traces;
  }

  // 過渡動畫期間 Plotly 會丟掉新的 react（座標軸停在舊範圍），
  // 所以動畫中進來的重繪先排隊；動畫結束後一律以不帶動畫的 react 套用最新狀態。
  function drawPlotly(el, traces, layout, animate) {
    if (el.dataset.mode !== "plotly") { el.innerHTML = ""; el.dataset.mode = "plotly"; }
    const st = el._anim || (el._anim = { busy: false, latest: null, sig: "" });
    // 圖形結構（trace 數量、種類、標記形狀）改變時不做動畫：
    // Plotly 會把圓形路徑內插成菱形，產生不合法的 SVG 路徑
    const sig = traces.map(t => `${t.type}:${t.mode}:${t.marker ? t.marker.symbol : ""}:${t.fill || ""}`).join("|");
    if (sig !== st.sig) animate = false;
    st.sig = sig;
    st.latest = { traces, layout };
    if (st.busy) return;
    if (!animate) { window.Plotly.react(el, traces, layout, PLOT_CONFIG); return; }
    st.busy = true;
    window.Plotly.react(el, traces, { ...layout, transition: { duration: TRANSITION_MS, easing: "cubic-in-out" } }, PLOT_CONFIG);
    setTimeout(() => {
      st.busy = false;
      if (el.dataset.mode === "plotly" && st.latest) window.Plotly.react(el, st.latest.traces, st.latest.layout, PLOT_CONFIG);
    }, TRANSITION_MS + 60);
  }

  function clearPlotly(el) {
    if (el.dataset.mode === "plotly" && window.Plotly) window.Plotly.purge(el);
    if (el._anim) el._anim = { busy: false, latest: null };
  }

  function drawSpec(el, spec, animate) {
    if (plotlyOk()) {
      const layout = { ...baseLayout(el), xaxis: axis(spec.xTitle, spec.xRange), yaxis: axis(spec.yTitle, spec.yRange) };
      drawPlotly(el, specTraces(spec), layout, animate);
    } else {
      clearPlotly(el);
      el.dataset.mode = "svg";
      el.innerHTML = svgSpec(spec);
    }
  }

  function niceTicks(lo, hi) {
    const raw = (hi - lo) / 4;
    if (!(raw > 0)) return [lo];
    const pow = Math.pow(10, Math.floor(Math.log10(raw)));
    const step = [1, 2, 2.5, 5, 10].map(m => m * pow).find(s => s >= raw) || raw;
    const out = [];
    for (let v = Math.ceil(lo / step) * step; v <= hi + 1e-9; v += step) out.push(+v.toFixed(10));
    return out;
  }

  const SVG_SHAPES = {
    circle: (x, y, s) => `<circle cx="${x}" cy="${y}" r="${s / 2}"/>`,
    square: (x, y, s) => `<rect x="${x - s / 2.4}" y="${y - s / 2.4}" width="${s / 1.2}" height="${s / 1.2}"/>`,
    diamond: (x, y, s) => `<rect x="${x - s / 2.6}" y="${y - s / 2.6}" width="${s / 1.3}" height="${s / 1.3}" transform="rotate(45 ${x} ${y})"/>`,
    "triangle-up": (x, y, s) => `<polygon points="${x},${y - s / 1.8} ${x - s / 2},${y + s / 2.6} ${x + s / 2},${y + s / 2.6}"/>`,
    cross: (x, y, s) => `<path d="M${x - s / 2} ${y}H${x + s / 2}M${x} ${y - s / 2}V${y + s / 2}" stroke-width="3"/>`,
    x: (x, y, s) => `<path d="M${x - s / 2.5} ${y - s / 2.5}L${x + s / 2.5} ${y + s / 2.5}M${x - s / 2.5} ${y + s / 2.5}L${x + s / 2.5} ${y - s / 2.5}" stroke-width="3"/>`
  };

  // 備援：Plotly 載入失敗時，以原生 SVG 畫同一份規格
  function svgSpec(spec) {
    const W = 520, H = 380, m = { l: 56, r: 16, t: 12, b: 48 };
    const [x0, x1] = spec.xRange, [y0, y1] = spec.yRange;
    const sx = v => m.l + ((v - x0) / (x1 - x0)) * (W - m.l - m.r);
    const sy = v => H - m.b - ((v - y0) / (y1 - y0)) * (H - m.t - m.b);
    const fmtTick = v => (Math.abs(v) >= 100 ? Math.round(v) : +v.toFixed(2));
    const xt = niceTicks(Math.max(x0, 0), x1), yt = niceTicks(Math.max(y0, 0), y1);
    const grid = xt.map(t => `<line x1="${sx(t)}" x2="${sx(t)}" y1="${m.t}" y2="${H - m.b}" stroke="var(--grid)"/>` +
        `<text x="${sx(t)}" y="${H - m.b + 16}" text-anchor="middle" font-size="11" fill="var(--muted)">${fmtTick(t)}</text>`).join("") +
      yt.map(t => `<line x1="${m.l}" x2="${W - m.r}" y1="${sy(t)}" y2="${sy(t)}" stroke="var(--grid)"/>` +
        `<text x="${m.l - 6}" y="${sy(t) + 4}" text-anchor="end" font-size="11" fill="var(--muted)">${fmtTick(t)}</text>`).join("");
    const polys = spec.polys.map(p => `<polygon points="${p.x.map((x, k) => `${sx(x).toFixed(1)},${sy(p.y[k]).toFixed(1)}`).join(" ")}" ` +
      `fill="var(${p.color})" fill-opacity="0.22" clip-path="url(#sv-clip)"><title>${esc(p.name)}</title></polygon>`).join("");
    const dashes = { dash: "7 5", dot: "2 4", solid: "" };
    const lines = spec.lines.map(l => {
      const segs = []; let cur = [];
      l.x.forEach((x, k) => {
        const y = l.y[k];
        if (x === null || y === null || !Number.isFinite(x) || !Number.isFinite(y)) { if (cur.length > 1) segs.push(cur); cur = []; }
        else cur.push(`${sx(x).toFixed(1)},${sy(y).toFixed(1)}`);
      });
      if (cur.length > 1) segs.push(cur);
      return segs.map(sg => `<polyline points="${sg.join(" ")}" fill="none" stroke="var(${l.color})" stroke-width="${l.width || 2.5}" ` +
        `stroke-dasharray="${dashes[l.dash || "solid"]}" clip-path="url(#sv-clip)"><title>${esc(l.name)}</title></polyline>`).join("");
    }).join("");
    const marks = spec.points.map(p => {
      const shape = (SVG_SHAPES[p.symbol] || SVG_SHAPES.circle)(sx(p.x), sy(p.y), p.size);
      const paint = p.open || p.symbol === "cross" || p.symbol === "x"
        ? `fill="none" stroke="var(${p.color})" stroke-width="2"` : `fill="var(${p.color})" stroke="var(--bg)" stroke-width="1.5"`;
      return `<g ${paint}><title>${esc(String(p.text).replace(/<br>/g, "，").replace(/<\/?b>/g, ""))}</title>${shape}</g>`;
    }).join("");
    const legend = [
      ...spec.polys.map(p => `<span><span class="dot" style="background:var(${p.color});opacity:.5"></span>${esc(p.name)}</span>`),
      ...spec.lines.map(l => `<span><span class="dot" style="background:var(${l.color})"></span>${esc(l.name)}</span>`),
      ...spec.points.map(p => `<span>${p.open ? "○" : "◆"} ${esc(p.name)}</span>`)
    ].join("　");
    return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="calc(100% - 44px)" role="img" aria-label="${esc(spec.xTitle)}（簡化圖）" style="display:block">
      <defs><clipPath id="sv-clip"><rect x="${m.l}" y="${m.t}" width="${W - m.l - m.r}" height="${H - m.t - m.b}"/></clipPath></defs>
      ${grid}
      <line x1="${m.l}" x2="${W - m.r}" y1="${H - m.b}" y2="${H - m.b}" stroke="var(--muted)"/>
      <line x1="${m.l}" x2="${m.l}" y1="${m.t}" y2="${H - m.b}" stroke="var(--muted)"/>
      <text x="${(m.l + W - m.r) / 2}" y="${H - 8}" text-anchor="middle" font-size="12" fill="var(--fg)">${esc(spec.xTitle)}</text>
      <text x="14" y="${(m.t + H - m.b) / 2}" text-anchor="middle" font-size="12" fill="var(--fg)" transform="rotate(-90 14 ${(m.t + H - m.b) / 2})">${esc(spec.yTitle)}</text>
      ${polys}${lines}${marks}
    </svg><div class="note" style="margin-top:4px">${legend}</div>`;
  }

  /* ---------- 反應曲線 F04 ＋ 等利潤曲線 F16 ---------- */
  function reactionSpec(res) {
    const inp = econInput();
    const par = Econ.normalize(inp);
    const { a, b, g, c1, c2 } = par;
    const r = res[State.model];
    const L = par.leader, F = 3 - L;
    const spec = { lines: [], polys: [], points: [], note: "" };
    const eqName = { cournot: "Cournot–Nash 均衡", bertrand: "Bertrand 均衡", stackelberg: "Stackelberg 均衡" }[State.model];
    const ptText = (name, x, y, pi, xs, ys) =>
      `<b>${name}</b><br>${xs} = ${fmt(x)}<br>${ys} = ${fmt(y)}<br>π₁ = ${fmt(pi[0])}<br>π₂ = ${fmt(pi[1])}`;
    let M, isoNote = "";

    if (State.model === "bertrand") {
      M = a;
      spec.xs = "p₁"; spec.ys = "p₂";
      spec.xTitle = "廠商 1 價格 p₁"; spec.yTitle = "廠商 2 價格 p₂";
      const extras = [c1, c2, (a + c1) / 2, (a + c2) / 2].flatMap(v => [v - 0.011, v, v + 1e-6]);
      const grid = sortedUnique([...linspace(0, M, 241), ...extras.filter(v => v >= 0 && v <= M)]);
      const br = par.homo
        ? (i, p) => Econ.reaction.priceHomo(inp, i, p)
        : (i, p) => Econ.reaction.priceDiff(inp, i, p);
      spec.lines.push({ name: "廠商 1 反應函數 BR₁(p₂)", color: "--f1", x: grid.map(p => br(1, p)), y: grid });
      spec.lines.push({ name: "廠商 2 反應函數 BR₂(p₁)", color: "--f2", x: grid, y: grid.map(p => br(2, p)) });
