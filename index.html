      if (!isLimit(r)) {
        let x = r.p1, y = r.p2;
        if (par.homo && Math.abs(c1 - c2) > 1e-9) {          // 同質：高成本廠商的報價為 max(P, c_H)
          const P = r.p1, pH = Math.max(P, Math.max(c1, c2));
          if (c1 < c2) y = pH; else x = pH;
        }
        spec.points.push({ name: eqName, x, y, symbol: "diamond", size: 15, color: "--eq", text: ptText(eqName, x, y, [r.pi1, r.pi2], "p₁", "p₂") });
      }
      spec.note = par.homo
        ? "同質 Bertrand 的反應函數是折線：對手價格高於自己成本時削價 ε = 0.01 搶下整個市場；高於獨占價時改訂獨占價。"
        : "價格反應曲線正斜率：對手漲價，我也跟著漲，即策略互補 Strategic complements。";
      if (State.showIso && isoAllowed() && !isLimit(r)) {
        for (const i of [1, 2]) {
          const line = isoLine(inp, "p", i, r[`pi${i}`], r[`p${i}`] > 0 && r[`q${i}`] > 0, M, `廠商 ${i} 等利潤曲線 π${i === 1 ? "₁" : "₂"} = ${fmt(r[`pi${i}`])}`, `--f${i}`, "dot");
          if (line) spec.lines.push(line);
        }
        isoNote = "點線是通過均衡點的等利潤曲線：每家廠商的等利潤曲線在自己的反應曲線上切線水平（或垂直），代表在對手價格給定下利潤已最大。";
      }
    } else {
      M = Math.max((a - Math.min(c1, c2)) / b, 1e-6) * 1.05;
      spec.xs = "q₁"; spec.ys = "q₂";
      spec.xTitle = "廠商 1 產量 q₁"; spec.yTitle = "廠商 2 產量 q₂";
      const kinks = g > 0 ? [(a - c1) / g, (a - c2) / g] : [];
      const grid = sortedUnique([...linspace(0, M, 241), ...kinks.filter(v => v > 0 && v < M)]);
      const R = (i, q) => Econ.reaction.quantity(inp, i, q);
      const profits = (q1, q2) => [(a - b * q1 - g * q2 - c1) * q1, (a - b * q2 - g * q1 - c2) * q2];
      const x1 = grid.map(q2 => R(1, q2)), y2 = grid.map(q1 => R(2, q1));
      const hov = name => `<b>${name}</b><br>q₁ = %{x:,.2f}<br>q₂ = %{y:,.2f}<br>π₁ = %{customdata[0]:,.2f}<br>π₂ = %{customdata[1]:,.2f}<extra></extra>`;
      const n1 = "廠商 1 反應函數 R₁(q₂)", n2 = "廠商 2 反應函數 R₂(q₁)";
      spec.lines.push({ name: n1, color: "--f1", x: x1, y: grid, customdata: grid.map((q2, k) => profits(x1[k], q2)), hover: hov(n1) });
      spec.lines.push({ name: n2, color: "--f2", x: grid, y: y2, customdata: grid.map((q1, k) => profits(q1, y2[k])), hover: hov(n2) });
      if (State.model === "stackelberg") {
        const c = res.cournot;
        spec.points.push({ name: "Cournot 均衡（對照）", x: c.q1, y: c.q2, symbol: "circle", size: 12, color: "--muted", open: true,
          text: ptText("Cournot 均衡（對照）", c.q1, c.q2, [c.pi1, c.pi2], "q₁", "q₂") });
      }
      spec.points.push({ name: eqName, x: r.q1, y: r.q2, symbol: "diamond", size: 15, color: "--eq", text: ptText(eqName, r.q1, r.q2, [r.pi1, r.pi2], "q₁", "q₂") });
      spec.note = State.model === "cournot"
        ? "兩條反應曲線的交點就是 Nash 均衡。斜率為負：對手多產，我就少產，即策略替代 Strategic substitutes。"
        : `領導者（廠商 ${L}）在追隨者（廠商 ${F}）的反應曲線上挑利潤最大的點；空心點為 Cournot 均衡，可看出領導者多產、追隨者少產。`;
      if (State.showIso && isoAllowed()) {
        if (State.model === "cournot") {
          for (const i of [1, 2]) {
            const line = isoLine(inp, "q", i, r[`pi${i}`], r[`q${i}`] > 0, M, `廠商 ${i} 等利潤曲線 π${i === 1 ? "₁" : "₂"} = ${fmt(r[`pi${i}`])}`, `--f${i}`, "dot");
            if (line) spec.lines.push(line);
          }
          isoNote = "點線是通過 Nash 點的等利潤曲線：每家廠商的等利潤曲線在自己的反應曲線上達到頂點（切線水平／垂直）。";
        } else {
          const piS = r[`pi${L}`], piC = res.cournot[`pi${L}`];
          const s = isoLine(inp, "q", L, piS, r[`q${L}`] > 0, M, `領導者等利潤 π${L === 1 ? "₁" : "₂"} = ${fmt(piS)}（Stackelberg）`, `--f${L}`, "dash");
          const c = isoLine(inp, "q", L, piC, res.cournot[`q${L}`] > 0, M, `領導者等利潤 π${L === 1 ? "₁" : "₂"} = ${fmt(piC)}（Cournot）`, "--muted", "dot");
          if (s) spec.lines.push(s);
          if (c) spec.lines.push(c);
          isoNote = r[`q${F}`] > 0
            ? "虛線是領導者通過 Stackelberg 點的等利潤曲線，正好與追隨者的反應曲線相切；點線通過 Cournot 點，利潤較低。"
            : "追隨者退出（角解），領導者的等利潤曲線不再與追隨者反應曲線相切。";
        }
      }
    }
    if (State.showIso && !isoAllowed()) {
      isoNote = State.model === "bertrand" && State.product === "homo"
        ? "同質 Bertrand 的利潤函數不連續，沒有平滑的等利潤曲線。"
        : "θ = 0 時對手策略不影響利潤，等利潤曲線退化為直線，因此不畫。";
    }
    if (isLimit(r)) spec.note = "此參數組合屬於 limit pricing 區間，本模擬器不計算均衡點。 " + spec.note;
    if (isoNote) spec.note += " " + isoNote;
    spec.xRange = [-0.02 * M, M * 1.02];
    spec.yRange = [-0.02 * M, M * 1.02];
    return spec;
  }

  // 一條等利潤曲線：沿自己的策略取樣，解出對手策略；超出畫面的點設為 null 讓線斷開
  function isoLine(inp, space, firm, piBar, ok, M, name, color, dash) {
    if (!ok || !(piBar > 1e-9)) return null;
    const ci = firm === 1 ? inp.c1 : inp.c2;
    const N = 400;
    const own = space === "q"
      ? linspace(M / N, M, N)
      : linspace(ci + (M - ci) / N, M, N);
    const other = own.map(v => {
      const o = space === "q" ? Iso.quantity(inp, firm, piBar, v) : Iso.price(inp, firm, piBar, v);
      return Number.isFinite(o) && o >= -0.1 * M && o <= 1.15 * M ? o : null;
    });
    if (other.filter(v => v !== null).length < 2) return null;
    const pts = own.map((v, k) => (other[k] === null ? [null, null] : (firm === 1 ? [v, other[k]] : [other[k], v])));
    return { name, color, dash, width: 1.8, x: pts.map(p => p[0]), y: pts.map(p => p[1]) };
  }

  function renderReaction(res) {
    const spec = reactionSpec(res);
    $("rc-title").innerHTML = State.model === "bertrand"
      ? `價格反應曲線 <span class="en">Price reaction curves (p₁, p₂)</span>`
      : `數量反應曲線 <span class="en">Quantity reaction curves (q₁, q₂)</span>`;
    $("rc-note").textContent = spec.note;
    drawSpec($("reaction-chart"), spec, State.animateNext);
  }

  /* ---------- 市場結構比較 F06 ＋ 市場圖 F15 ---------- */
  const COLS = [
    { key: "cournot", head: "Cournot" },
    { key: "bertrand", head: "Bertrand" },
    { key: "stackelberg", head: "Stackelberg" },
    { key: "pc", head: "完全競爭<br><small>Perfect comp.</small>", plain: "完全競爭", bench: true },
    { key: "monopoly", head: "獨占<br><small>Monopoly</small>", plain: "獨占", bench: true }
  ];
  let lastScrolledModel = null;

  function renderComparison(res) {
    const homo = State.product === "homo";
    const rows = [
      ...(homo ? [["價格", "P", r => r.p1, 0]] : [["價格", "P₁", r => r.p1, 1], ["價格", "P₂", r => r.p2, 2]]),
      ["產量", "q₁", r => r.q1, 1], ["產量", "q₂", r => r.q2, 2], ["總產量", "Q", r => r.q1 + r.q2, 0],
      ["利潤", "π₁", r => r.pi1, 1], ["利潤", "π₂", r => r.pi2, 2],
      ["消費者剩餘", "CS", r => r.cs, 0], ["社會福利", "SW", r => r.sw, 0], ["無謂損失", "DWL", r => r.dwl, 0]
    ];
    const head = `<tr><th scope="col"><span class="m-full">指標 Metric</span><span class="m-short">指標</span></th>${COLS.map(c =>
      `<th class="${c.key === State.model ? "current" : ""}${c.bench ? " bench" : ""}" scope="col">${c.head}</th>`).join("")}</tr>`;
    const body = rows.map(([zh, sym, get, firm]) => `<tr><th scope="row"><span class="m-full">${esc(zh)} </span>${esc(sym)}</th>${COLS.map(c => {
      const r = res[c.key];
      const zero = firm > 0 && r[`q${firm}`] === 0;
      const cls = [c.key === State.model ? "current" : "", zero ? "zero" : ""].filter(Boolean).join(" ");
      return `<td class="${cls}">${isLimit(r) ? "—" : fmt(get(r))}</td>`;
    }).join("")}</tr>`).join("");
    $("cmp-table").innerHTML = `<thead>${head}</thead><tbody>${body}</tbody>`;

    // 手機：每欄寬 =（可視寬度 − 固定第一欄）/ 2，一次剛好看到兩欄完整的資料，
    // 5 欄 = 2.5 個畫面，捲到底也落在欄位邊界，任何位置都不會出現被蓋住一半的欄
    const wrap = $("cmp-wrap"), table = $("cmp-table");
    const firstTh = table.querySelector("thead th");
    const mobile = window.matchMedia && window.matchMedia("(max-width: 767px)").matches;
    if (mobile && firstTh) {
      const fw = firstTh.getBoundingClientRect().width;
      const colw = Math.max(80, (wrap.clientWidth - fw) / 2);
      table.style.setProperty("--colw", `${colw}px`);
      table.style.width = `${fw + colw * COLS.length}px`;
      wrap.style.scrollPaddingLeft = `${fw}px`;
    } else {
      table.style.removeProperty("--colw"); table.style.width = ""; wrap.style.scrollPaddingLeft = "";
    }
    // 模型切換時把目前模型欄捲到可見處
    if (lastScrolledModel !== State.model && wrap.scrollWidth > wrap.clientWidth + 1) {
      const th = $("cmp-table").querySelector("thead th.current"), first = $("cmp-table").querySelector("thead th");
      if (th && first) wrap.scrollLeft = Math.max(0, th.offsetLeft - first.offsetWidth);
      lastScrolledModel = State.model;
    } else if (wrap.scrollWidth <= wrap.clientWidth + 1) lastScrolledModel = State.model;

    const el = $("cmp-chart"), note = $("cmp-chart-note"), mnote = $("market-note");
    el.classList.toggle("tall", State.compareView === "market");
    if (State.compareView === "market") {
      const spec = Market.build(econInput(), res, State.model);
      el.hidden = false; note.hidden = true;
      mnote.hidden = false; mnote.textContent = spec.note;
      drawSpec(el, spec, false);
      return;
    }
    mnote.hidden = true;
    if (!plotlyOk()) {
      clearPlotly(el);
      el.innerHTML = ""; el.dataset.mode = "none";
      el.hidden = true;
      note.hidden = State.cdn.plotly !== "fail";
      return;
    }
    el.hidden = false; note.hidden = true;
    const x = COLS.map(c => c.plain || c.head);
    const opacity = COLS.map(c => (c.key === State.model ? 1 : c.bench ? 0.4 : 0.6));
    const val = get => COLS.map(c => (isLimit(res[c.key]) ? null : get(res[c.key])));
    const bar = (name, y, color) => ({
      type: "bar", name, x, y, marker: { color, opacity },
      hovertemplate: `<b>%{x}</b><br>${name} = %{y:,.2f}<extra></extra>`
    });
    const traces = State.compareView === "welfare"
      ? [bar("消費者剩餘 CS", val(r => r.cs), css("--cs")),
         bar("生產者剩餘 PS = π₁ + π₂", val(r => r.pi1 + r.pi2), css("--ps")),
         bar("社會福利 SW", val(r => r.sw), css("--sw"))]
      : [...(homo ? [bar("價格 P", val(r => r.p1), css("--accent"))]
                  : [bar("價格 P₁", val(r => r.p1), css("--f1")), bar("價格 P₂", val(r => r.p2), css("--f2"))]),
         bar("總產量 Q", val(r => r.q1 + r.q2), css("--sw"))];
    const layout = {
      ...baseLayout(el), barmode: "group", bargap: 0.25,
      margin: { l: 56, r: 12, t: 8, b: 40 },
      legend: { orientation: "h", x: 0, y: 1.02, yanchor: "bottom", font: { size: 11 } },
      xaxis: { fixedrange: true, linecolor: css("--line"), automargin: true },
      yaxis: { fixedrange: true, gridcolor: css("--grid"), zerolinecolor: css("--line"), rangemode: "tozero", automargin: true }
    };
    drawPlotly(el, traces, layout, false);
  }

  /* ---------- 理論面板 F08 ＋ 代入數值 F12 ---------- */
  let theoryKey = "", substKey = "";
  function tex(texStr, plainText, display = true) {
    if (katexOk()) {
      try { return window.katex.renderToString(texStr, { displayMode: display, throwOnError: false }); }
      catch (e) { /* 改用純文字 */ }
    }
    return `<div class="plain">${esc(plainText)}</div>`;
  }
  const formulaHTML = f => `<div class="formula"><div class="cap">${esc(f.cap)}</div>${tex(f.tex, f.text)}</div>` +
    (f.eq ? `<div class="subst" id="subst-box" aria-live="polite"></div>` : "");

  function renderTheory() {
    const key = `${State.model}|${State.product}|${State.leader}|${katexOk()}`;
    if (key === theoryKey) return;
    theoryKey = key;
    substKey = "";
    const t = Theory.get(State.model, State.product === "homo", State.leader);
    $("theory-body").innerHTML = `
      <div class="theory-grid">
        <div>
          <h3>${esc(t.title)}</h3>
          <p><strong>直覺 Intuition：</strong>${esc(t.intuition)}</p>
          <p><strong>假設 Assumptions：</strong></p>
          <ul>${t.assumptions.map(s => `<li>${esc(s)}</li>`).join("")}</ul>
          ${t.formulas.map(formulaHTML).join("")}
          <ul>${t.notes.map(s => `<li>${esc(s)}</li>`).join("")}</ul>
        </div>
        <div>
          <h3>比較結論 Key results</h3>
          <ul>${Theory.keyResults.map(s => `<li>${esc(s)}</li>`).join("")}</ul>
          <h3>對照基準 Benchmarks</h3>
          ${Theory.benchmarks.map(formulaHTML).join("")}
        </div>
      </div>`;
  }

  function renderSubst() {
    const box = $("subst-box");
    if (!box) return;
    const items = Subst.get(State.model, econInput());
    const key = items.map(i => i.text + (i.note || "")).join("|") + katexOk();
    if (key === substKey) return;
    substKey = key;
    box.innerHTML = `<div class="cap">代入目前數值 With current values</div>` + items.map(i =>
      `<div class="subst-item">${tex(i.tex, i.text)}${i.note ? `<div class="subst-note">${esc(i.note)}</div>` : ""}</div>`).join("");
  }

  return { schedule, render, esc };
})();

/* =====================================================================
 * Theory — 理論說明內容（依規格書第 4 節）。tex 給 KaTeX，text 為純文字備援；eq 標記代入數值的位置。
 * ===================================================================== */
const Theory = (() => {
  const R = String.raw;
  const demand = homo => (homo
    ? { cap: "反需求 Inverse demand", tex: R`P = a - b\,(q_1 + q_2)`, text: "P = a − b·(q₁ + q₂)" }
    : { cap: "反需求 Inverse demand（γ = θ·b）", tex: R`P_i = a - b\,q_i - \gamma\,q_j,\qquad \gamma = \theta\,b`, text: "P_i = a − b·q_i − γ·q_j，γ = θ·b" });
  const profit = { cap: "利潤 Profit", tex: R`\pi_i = (P_i - c_i)\,q_i`, text: "π_i = (P_i − c_i)·q_i" };

  const models = {
    cournot: homo => ({
      title: "Cournot 數量競爭 Quantity competition",
      intuition: "兩家同時決定產量，各自把對手的產量視為給定。反應曲線斜率為負：對手多產，我就少產，即策略替代 Strategic substitutes。",
      assumptions: ["同時行動 Simultaneous move", homo ? "同質產品 Homogeneous products" : "差異化產品 Differentiated products（θ < 1）",
                    "策略變數為產量 Quantity", "固定邊際成本、無產能限制 Constant MC, no capacity limit"],
      formulas: [
        demand(homo), profit,
        homo
          ? { cap: "反應函數 Reaction function", tex: R`R_i:\; q_i = \frac{a - c_i - b\,q_j}{2b}`, text: "q_i = (a − c_i − b·q_j) / (2b)" }
          : { cap: "反應函數 Reaction function", tex: R`R_i:\; q_i = \frac{a - c_i - \gamma\,q_j}{2b}`, text: "q_i = (a − c_i − γ·q_j) / (2b)" },
        homo
          ? { eq: true, cap: "均衡 Equilibrium", tex: R`q_i^{*} = \frac{a - 2c_i + c_j}{3b},\qquad P^{*} = \frac{a + c_1 + c_2}{3}`, text: "q_i* = (a − 2c_i + c_j) / (3b)，P* = (a + c₁ + c₂) / 3" }
          : { eq: true, cap: "均衡 Equilibrium", tex: R`q_i^{*} = \frac{2b(a-c_i) - \gamma(a-c_j)}{4b^2-\gamma^2}`, text: "q_i* = [2b(a − c_i) − γ(a − c_j)] / (4b² − γ²)" },
        { cap: "均衡利潤 Equilibrium profit", tex: R`\pi_i^{*} = b\,(q_i^{*})^2`, text: "π_i* = b·(q_i*)²" }
      ],
      notes: ["角解 Corner solution：若 q_j* ≤ 0，廠商 j 退出，廠商 i 以獨占產量 (a − c_i)/(2b) 生產。"]
    }),
    bertrand: homo => (homo ? {
      title: "Bertrand 價格競爭（同質）Price competition, homogeneous",
      intuition: "兩家同時訂價，價格最低者拿走整個市場，平手均分。只要兩家廠商，價格就被壓到邊際成本，即 Bertrand 悖論 Bertrand paradox。",
      assumptions: ["同時訂價 Simultaneous pricing", "同質產品，消費者只向最低價購買", "無產能限制 No capacity constraints"],
      formulas: [
        { cap: "市場需求 Market demand", tex: R`Q = \frac{a - P}{b}`, text: "Q = (a − P) / b" },
        { cap: "反應函數 Best response（分段）", tex: R`BR_i(p_j) = \begin{cases} p_i^m & p_j > p_i^m \\ p_j - \varepsilon & c_i < p_j \le p_i^m \\ c_i & p_j \le c_i \end{cases},\qquad p_i^m = \frac{a + c_i}{2}`,
          text: "BR_i(p_j) = p_i^m（p_j > p_i^m）；p_j − ε（c_i < p_j ≤ p_i^m）；c_i（p_j ≤ c_i）；p_i^m = (a + c_i)/2" },
        { cap: "對稱成本 Symmetric cost", tex: R`c_1 = c_2 = c \;\Rightarrow\; P^{*} = c,\quad \pi_1^{*} = \pi_2^{*} = 0`, text: "c₁ = c₂ = c ⇒ P* = c，π₁* = π₂* = 0" },
        { eq: true, cap: "不對稱成本 Asymmetric cost（c_L < c_H < p_L^m）", tex: R`P^{*} = c_H - \varepsilon,\qquad \pi_L^{*} = (c_H - c_L)\,\frac{a - c_H}{b},\quad \pi_H^{*} = 0`,
          text: "P* = c_H − ε，π_L* = (c_H − c_L)·(a − c_H)/b，π_H* = 0" }
      ],
      notes: ["若 c_H ≥ p_L^m，低成本廠商直接訂獨占價 p_L^m。", "圖上 ε 取 0.01；數值結果以 ε → 0 計算。"]
    } : {
      title: "Bertrand 價格競爭（差異化）Price competition, differentiated",
      intuition: "產品不完全替代，降價只能搶走部分顧客，所以價格高於邊際成本。價格反應曲線斜率為正：對手漲價，我也跟著漲，即策略互補 Strategic complements。",
      assumptions: ["同時訂價 Simultaneous pricing", "差異化產品 Differentiated products（θ < 1）", "無產能限制 No capacity constraints"],
      formulas: [
        demand(false),
        { cap: "直接需求 Direct demand", tex: R`q_i = \frac{a(b-\gamma) - b\,p_i + \gamma\,p_j}{b^2-\gamma^2}`, text: "q_i = [a(b − γ) − b·p_i + γ·p_j] / (b² − γ²)" },
        { cap: "反應函數 Reaction function", tex: R`R_i:\; p_i = \frac{a(b-\gamma) + b\,c_i + \gamma\,p_j}{2b}`, text: "p_i = [a(b − γ) + b·c_i + γ·p_j] / (2b)" },
        { eq: true, cap: "均衡 Equilibrium", tex: R`p_i^{*} = \frac{2b\,k_i + \gamma\,k_j}{4b^2-\gamma^2},\qquad k_i = a(b-\gamma) + b\,c_i`, text: "p_i* = (2b·k_i + γ·k_j) / (4b² − γ²)，k_i = a(b − γ) + b·c_i" }
      ],
      notes: ["θ 上限 0.95：θ → 1 時直接需求的分母 b² − γ² → 0。",
              "角解：若 q_j* ≤ 0 且廠商 i 獨占成立，廠商 j 退出；否則屬於 limit pricing 區間，本版不計算。"]
    }),
    stackelberg: (homo, leader) => ({
      title: "Stackelberg 數量領導 Leader–follower",
      intuition: "領導者先決定並承諾產量，追隨者觀察後依自己的反應函數回應。領導者預見這一點而多產、先占市場，取得先行者優勢 First-mover advantage。",
      assumptions: ["序列行動 Sequential move", "領導者能承諾產量 Commitment", "策略變數為產量 Quantity",
                    `目前領導者 L = 廠商 ${leader}、追隨者 F = 廠商 ${3 - leader}（可在控制欄切換）`],
      formulas: [
        demand(homo),
        { cap: "追隨者反應函數 Follower's reaction", tex: R`q_F = R_F(q_L) = \max\!\left\{0,\ \frac{a - c_F - \gamma\,q_L}{2b}\right\}`, text: "q_F = max{0, (a − c_F − γ·q_L) / (2b)}" },
        { cap: "領導者問題 Leader's problem", tex: R`\max_{q_L}\ \big(P_L(q_L, R_F(q_L)) - c_L\big)\,q_L`, text: "max over q_L：[P_L(q_L, R_F(q_L)) − c_L]·q_L" },
        homo
          ? { eq: true, cap: "均衡 Equilibrium", tex: R`q_L^{*} = \frac{a - 2c_L + c_F}{2b},\qquad q_F^{*} = \frac{a + 2c_L - 3c_F}{4b}`, text: "q_L* = (a − 2c_L + c_F) / (2b)，q_F* = (a + 2c_L − 3c_F) / (4b)" }
          : { eq: true, cap: "均衡 Equilibrium", tex: R`q_L^{*} = \frac{2b(a-c_L) - \gamma(a-c_F)}{2(2b^2-\gamma^2)},\qquad q_F^{*} = R_F(q_L^{*})`, text: "q_L* = [2b(a − c_L) − γ(a − c_F)] / [2(2b² − γ²)]，q_F* = R_F(q_L*)" }
      ],
      notes: ["角解有兩種：追隨者產量為 0（嚇阻進入 Entry deterrence），或領導者成本過高而產量為 0。",
              "程式同時以封閉解與數值法求領導者最適產量，兩者不一致時採數值解。",
              "打開「等利潤曲線」可看到：領導者的等利潤曲線在 Stackelberg 點與追隨者反應曲線相切。"]
    })
  };

  const keyResults = [
    "同質、對稱成本時，產量 Q：完全競爭 = Bertrand > Stackelberg > Cournot > 獨占；價格順序相反。",
    "社會福利 SW 的順序與產量相同；無謂損失 DWL = SW(完全競爭) − SW。",
    "差異化時，Bertrand 價格低於 Cournot、社會福利較高（Singh & Vives, 1984）。",
    "Stackelberg 領導者利潤高於 Cournot，追隨者利潤低於 Cournot。",
    "反應曲線斜率：Cournot 為 −γ/(2b)（策略替代）；差異化 Bertrand 為 +γ/(2b)（策略互補）。",
    "勒納指數 Lerner index Lᵢ = (Pᵢ − cᵢ)/Pᵢ 衡量市場力量；同質 Cournot 中 Lᵢ = sᵢ/ε（市占除以需求彈性）。HHI = 10,000 × Σ sᵢ²。"
  ];

  const benchmarks = [
    { cap: "完全競爭 Perfect competition（P = MC）", tex: R`P_i = c_i,\qquad \pi_i = 0`, text: "P_i = c_i，π_i = 0（同質時 P = min(c₁, c₂)）" },
    { cap: "獨占 Monopoly：聯合利潤最大 Joint profit max（同質時由低成本廠商生產）", tex: R`Q^{M} = \frac{a - c_L}{2b},\qquad P^{M} = \frac{a + c_L}{2}`, text: "Q^M = (a − c_L) / (2b)，P^M = (a + c_L) / 2" },
    { cap: "福利 Welfare", tex: R`CS = \tfrac{1}{2}\left(b\,q_1^2 + 2\gamma\,q_1q_2 + b\,q_2^2\right),\qquad SW = CS + \pi_1 + \pi_2`, text: "CS = ½(b·q₁² + 2γ·q₁q₂ + b·q₂²)，SW = CS + π₁ + π₂" },
    { cap: "市場力量 Market power", tex: R`L_i = \frac{P_i - c_i}{P_i},\qquad HHI = 10{,}000 \times \textstyle\sum_i s_i^2`, text: "L_i = (P_i − c_i)/P_i，HHI = 10,000 × Σ s_i²" }
  ];

  return { get: (model, homo, leader = 1) => models[model](homo, leader), keyResults, benchmarks };
})();

/* =====================================================================
 * UI — 建立畫面骨架、綁定事件、載入 CDN（唯一處理使用者輸入的地方）
 * ===================================================================== */
const UI = (() => {
  const CDN = {

    plotly: "https://cdn.jsdelivr.net/npm/plotly.js-basic-dist-min@2.35.2/plotly-basic.min.js"

  const CDN_TIMEOUT_MS = 10000;
  const esc = Render.esc;

  function paramHTML(def) {

      </div>
      <div class="presets" role="group" aria-label="預設情境 Presets">

        <div class="controls-body" id="controls-body">
          <div class="ctl-group">

            <div class="seg" role="tablist" aria-label="模型 Model">

          </div>
          <div class="ctl-group" id="leader-group" hidden>

              <button type="button" data-leader="2" aria-pressed="false"><span class="dot f2"></span>廠商 2<small>Firm 2 leads</small></button>
            </div>
          </div>
          <div class="ctl-group">
            <p class="ctl-label">產品型態 Product</p>
            <div class="seg two" role="group" aria-label="產品型態 Product">
              <button type="button" data-product="homo" aria-pressed="false">同質<small>Homogeneous θ = 1</small></button>

          <section class="card" aria-labelledby="rc-title">

            <p class="note" id="rc-note"></p>
          </section>
          <section class="card" aria-labelledby="results-title">
            <h2 id="results-title">結果 Results</h2>

          <p class="note scroll-hint">左右滑動表格，查看全部 5 種市場結構 →</p>
          <div class="table-wrap cmp-wrap" id="cmp-wrap"><table class="cmp" id="cmp-table"></table></div>
          <div class="cmp-toggle" role="group" aria-label="圖表內容 Chart">
            <button type="button" class="btn" data-view="welfare" aria-pressed="true">福利 Welfare</button>
            <button type="button" class="btn" data-view="pq" aria-pressed="false">價格與產量 P &amp; Q</button>
            <button type="button" class="btn" data-view="market" aria-pressed="false">市場圖 Market</button>
          </div>
          <div id="cmp-chart" class="chart bars"></div>
          <p class="note" id="market-note" hidden></p>
          <p class="note" id="cmp-chart-note" hidden>長條圖需要 Plotly，目前請以上方表格比較；市場圖仍可使用。</p>
          <p class="note">藍底欄位為目前模型；完全競爭與獨占為對照基準。灰色數字表示該廠商產量為 0。</p>

        <details open>
          <summary>理論說明 Theory</summary>
          <div id="theory-body"></div>
        </details>
      </section>
    </div>`;
  }

  function flash(el) {
    el.classList.remove("invalid");
    void el.offsetWidth;                        // 重新觸發動畫
    el.classList.add("invalid");
    clearTimeout(el._flashTimer);
    el._flashTimer = setTimeout(() => el.classList.remove("invalid"), 1200);
  }

  function commitNumber(def, el) {
    const raw = el.value.trim();
    const v = Number(raw);
    if (raw === "" || !Number.isFinite(v)) {     // 非數字：不重算，還原顯示
      flash(el);
      el.value = String(Math.round(getParam(def.key) * 1000) / 1000);
      return;
    }
    const clamped = clampParam(def, v);
    if (clamped !== v) flash(el);
    el.value = String(Math.round(clamped * 1000) / 1000);
    if (clamped !== getParam(def.key)) { setParam(def.key, clamped); Render.schedule(); }
  }

  function bind(root) {
    for (const def of PARAM_DEFS) {
      const rng = document.getElementById(`rng-${def.key}`);
      const num = document.getElementById(`num-${def.key}`);
      rng.addEventListener("input", () => { setParam(def.key, Number(rng.value)); Render.schedule(); });
      num.addEventListener("change", () => commitNumber(def, num));
      num.addEventListener("keydown", e => { if (e.key === "Enter") commitNumber(def, num); });
    }
    root.addEventListener("click", e => {
      const t = e.target.closest("button");
      if (!t || t.disabled) return;
      if (t.dataset.model) { if (State.model !== t.dataset.model) { State.model = t.dataset.model; State.preset = null; State.animateNext = true; } }
      else if (t.dataset.product) { if (State.product !== t.dataset.product) { State.product = t.dataset.product; State.preset = null; State.animateNext = true; } }
      else if (t.dataset.leader) { const L = Number(t.dataset.leader); if (State.leader !== L) { State.leader = L; State.preset = null; State.animateNext = true; } }
      else if (t.dataset.preset) applyPreset(t.dataset.preset);
      else if (t.dataset.view) State.compareView = t.dataset.view;
      else if (t.id === "iso-toggle") State.showIso = !State.showIso;
      else if (t.id === "controls-toggle") State.controlsCollapsed = !State.controlsCollapsed;
      else return;
      Render.schedule();
    });
    // 模型分頁：左右方向鍵切換
    root.querySelector('[role="tablist"]').addEventListener("keydown", e => {
      if (e.key !== "ArrowRight" && e.key !== "ArrowLeft") return;
      const keys = Object.keys(MODELS);
      const i = keys.indexOf(State.model) + (e.key === "ArrowRight" ? 1 : -1);
      State.model = keys[(i + keys.length) % keys.length];
      State.preset = null; State.animateNext = true;
      Render.render();
      root.querySelector(`[data-model="${State.model}"]`).focus();
    });
    window.addEventListener("resize", () => Render.schedule());   // 手機轉向時重算比較表欄寬
    if (window.matchMedia) {
      const mq = window.matchMedia("(prefers-color-scheme: dark)");
      if (mq.addEventListener) mq.addEventListener("change", () => Render.schedule());
    }
  }

  // 載入單一外部資源；逾時視為失敗，但若之後仍載入成功會再通知一次
  function loadAsset(kind, url, onStatus) {
    let settled = false;
    const report = ok => { if (!settled || ok) { settled = true; onStatus(ok); } };
    const el = kind === "css" ? document.createElement("link") : document.createElement("script");
    if (kind === "css") { el.rel = "stylesheet"; el.href = url; } else { el.src = url; el.async = true; }
    el.onload = () => report(true);
    el.onerror = () => report(false);
    setTimeout(() => { if (!settled) report(false); }, CDN_TIMEOUT_MS);
    document.head.appendChild(el);
  }

  function loadLibraries() {
    const parts = { css: null, js: null };
    const updateKatex = () => {
      if (parts.css === false || parts.js === false) State.cdn.katex = "fail";
      else if (parts.css && parts.js) State.cdn.katex = typeof window.katex !== "undefined" ? "ok" : "fail";
      Render.schedule();
    };
    loadAsset("css", CDN.katexCss, ok => { parts.css = ok; updateKatex(); });
    loadAsset("js", CDN.katexJs, ok => { parts.js = ok; updateKatex(); });
    loadAsset("js", CDN.plotly, ok => {
      State.cdn.plotly = ok && typeof window.Plotly !== "undefined" ? "ok" : "fail";
      Render.schedule();
    });
  }

  function init(root) {
    root.className = "app";
    root.innerHTML = skeleton();
    bind(root);
    Lessons.mount(document.getElementById("lessons"));
    Render.render();          // 先以純文字公式與簡化圖呈現，函式庫載入後自動升級
    loadLibraries();
  }

  return { init, CDN };
})();

/* =====================================================================
 * 啟動 Boot：?test=1 顯示自我測試報告，否則啟動介面
 * ===================================================================== */
if (typeof document !== "undefined") {
  const app = document.getElementById("app");
  const esc = s => String(s).replace(/[&<>"]/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[ch]));
  const fmt = x => (Number.isFinite(x) ? (+x.toFixed(4)).toLocaleString("en-US", { maximumFractionDigits: 4 }) : String(x));
  const tag = ok => `<span class="tag ${ok ? "pass" : "fail"}">${ok ? "PASS" : "FAIL"}</span>`;
  const params = new URLSearchParams(location.search);

  if (params.get("test") === "1") {
    const r = Tests.run();
    const r3 = Tests3.run();                         // Phase 3 新增計算的測試
    const r4 = Lessons.selfTest();                   // 動畫教學的資料層測試
    const passed = r.passed + r3.passed + r4.passed, total = r.total + r3.total + r4.total;
    const allOk = passed === total;
    const specRows = r.spec.map(row => `
      <tr>
        <td>${tag(row.pass)}</td>
        <td>${esc(row.label)}</td>
        <td>${esc(row.model)}</td>
        <td>${row.error ? `<span class="chk fail">錯誤：${esc(row.error.message)}</span>` :
          row.checks.map(k => `<span class="chk ${k.pass ? "" : "fail"}">${esc(k.key)} ${fmt(k.actual)}${k.pass ? "" : `（應為 ${fmt(k.expected)}）`}</span>`).join("　")}</td>
      </tr>`).join("");
    const simpleRows = rows => rows.map(row => `
      <tr><td>${tag(row.pass)}</td><td>${esc(row.label)}</td><td>${esc(row.detail)}</td></tr>`).join("");

    app.innerHTML = `
      <h1>自我測試 Self-test</h1>
      <div class="muted">容差 Tolerance ±${Tests.TOL}；預期值見規格書第 9.1 節</div>
      <div class="summary ${allOk ? "ok" : "bad"}">
        第 9.1 節：${r.specPassed} / ${r.specTotal} pass　｜　Phase 3 新增：${r3.passed} / ${r3.total} pass　｜　動畫教學：${r4.passed} / ${r4.total} pass　｜　全部檢查：${passed} / ${total} pass
      </div>

      <h2>第 9.1 節數值案例 Spec test cases（a = 100、b = 1）</h2>
      <div class="table-wrap"><table>
        <thead><tr><th>結果</th><th>案例</th><th>模型</th><th>實際值（失敗時附預期值）</th></tr></thead>
        <tbody>${specRows}</tbody>
      </table></div>

      <h2>額外 1：極端值掃描 Extreme values（θ 0–1、兩種 Leader、5 種市場結構）</h2>
      <div class="table-wrap"><table>
        <thead><tr><th>結果</th><th>參數</th><th>說明</th></tr></thead>
        <tbody>${simpleRows(r.sweep)}</tbody>
      </table></div>

      <h2>額外 2：Stackelberg 封閉解 vs 數值解 Analytic vs numeric</h2>
      <div class="table-wrap"><table>
        <thead><tr><th>結果</th><th>範圍</th><th>說明</th></tr></thead>
        <tbody>${simpleRows(r.agree)}</tbody>
      </table></div>

      <h2>額外 3：理論結論 Theory checks</h2>
      <div class="table-wrap"><table>
        <thead><tr><th>結果</th><th>檢查</th><th>數值</th></tr></thead>
        <tbody>${simpleRows(r.order)}</tbody>
      </table></div>

      <h2>Phase 3 新增計算 New calculations（F12 代入算式、F15 市場圖、F16 等利潤曲線、F17 Lerner / HHI）</h2>
      <div class="table-wrap"><table>
        <thead><tr><th>結果</th><th>功能</th><th>檢查</th><th>說明</th></tr></thead>
        <tbody>${r3.rows.map(row => `
          <tr><td>${tag(row.pass)}</td><td>${esc(row.group)}</td><td>${esc(row.label)}</td><td>${esc(row.detail)}</td></tr>`).join("")}</tbody>
      </table></div>

      <h2>動畫教學 Animated lessons（資料層）</h2>
      <div class="table-wrap"><table>
        <thead><tr><th>結果</th><th>功能</th><th>檢查</th><th>說明</th></tr></thead>
        <tbody>${r4.rows.map(row => `
          <tr><td>${tag(row.pass)}</td><td>${esc(row.group)}</td><td>${esc(row.label)}</td><td>${esc(row.detail)}</td></tr>`).join("")}</tbody>
      </table></div>`;
    document.title = `${allOk ? "✅" : "❌"} ${passed}/${total} — Self-test`;
  } else {
    UI.init(app);                       // 正式介面
  }
}

/* Node 測試用：node 環境下匯出 */
if (typeof module !== "undefined" && module.exports) module.exports = { Econ, Tests, Tests3, Subst, Iso, Market, Lessons };
